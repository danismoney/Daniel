<div id="ks" style="display:none;position:fixed;inset:0;background:#060b14;z-index:9999;align-items:center;justify-content:center;padding:20px;padding-top:max(var(--sat),24px)">
  <div style="width:min(420px,100%);background:#0d1625;border:1px solid rgba(99,179,237,.2);border-radius:16px;padding:28px">
    <div style="font-size:24px;font-weight:700;margin-bottom:4px">💰 Dani's Money</div>

      <button onclick="tv('ka','ea')" id="ea" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:rgba(255,255,255,.4)">👁</button>

    <button onclick="sk()" style="width:100%;padding:13px;background:linear-gradient(135deg,rgba(99,179,237,.3),rgba(167,139,250,.25));border:1px solid rgba(99,179,237,.4);border-radius:10px;color:#f7fafc;font-size:15px;cursor:pointer;font-weight:700;font-family:Heebo,sans-serif;margin-bottom:12px">שמור והפעל ←</button>
    <div style="font-size:10px;color:rgba(255,255,255,.2);text-align:center;line-height:1.7">🔒 נשמר ב-localStorage בלבד</div>
  </div>
</div>

<script>
function tv(a,b){var i=document.getElementById(a),btn=document.getElementById(b);i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'👁':'🙈';}
function sk(){
  var a=document.getElementById('ka').value.trim(),e=document.getElementById('ke');
  e.style.display='none';
  if(!a){e.style.display='block';e.textContent='⚠️ הכנס את ה-Key';return;}
  if(!a.startsWith('sk-ant')){e.style.display='block';e.textContent='⚠️ Key חייב להתחיל ב-sk-ant';return;}
  localStorage.setItem('dm_key',a);
  document.getElementById('ks').style.display='none';
  boot();
}
window.clearKeys=function(){localStorage.removeItem('dm_key');location.reload();};
window.resetKey=function(){if(confirm('לאפס את ה-API Key?')){localStorage.removeItem('dm_key');location.reload();}};
window.addEventListener('DOMContentLoaded',function(){
  var a=localStorage.getItem('dm_key');
  if(a&&a.startsWith('sk-ant')){boot();}
  else{document.getElementById('ks').style.display='flex';}
});
var booted=false;
function boot(){if(booted)return;booted=true;setTimeout(function(){Babel.transformScriptTags();},80);}
</script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const AKEY=()=>localStorage.getItem('dm_key')||'';
const PROXY='https://daniel1.danironen123.workers.dev';

function wt(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}

/* ── AI דרך Cloudflare Worker ── */
async function ask(prompt){
  var key=AKEY();
  if(!key)throw new Error('אין API key — לחץ ⚙️');
  var body=JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:prompt}]});
  var r=await wt(fetch(PROXY,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},
    body:body
  }),15000);
  if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error((e.error&&e.error.message)||'שגיאה '+r.status);}
  var d=await r.json();
  return(d.content&&d.content[0]&&d.content[0].text)||'';
}

/* ── live price + פרה/אפטר מרקט ── */
async function fetchLive(ticker){
  try{
    var url='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range=1d';
    var r=await wt(fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url)),8000);
    if(!r.ok)return null;
    var j=await r.json();
    var data=JSON.parse(j.contents);
    var meta=data&&data.chart&&data.chart.result&&data.chart.result[0]&&data.chart.result[0].meta;
    if(!meta||!meta.regularMarketPrice)return null;
    var price=meta.regularMarketPrice;
    var prev=meta.chartPreviousClose||meta.previousClose||price;
    var change=((price-prev)/prev)*100;
    var state=meta.marketState;
    var extPrice=null,extChange=null,extLabel=null;
    if(state==='PRE'&&meta.preMarketPrice){
      extPrice=meta.preMarketPrice;
      extChange=meta.preMarketChangePercent||((meta.preMarketPrice-price)/price*100);
      extLabel='פרה';
    }else if((state==='POST'||state==='CLOSED')&&meta.postMarketPrice){
      extPrice=meta.postMarketPrice;
      extChange=meta.postMarketChangePercent||((meta.postMarketPrice-price)/price*100);
      extLabel='אפטר';
    }
    return{price:price,change:change,extPrice:extPrice,extChange:extChange,extLabel:extLabel,state:state};
  }catch(e){}
  return null;
}
async function fetchAll(tickers){
  var res=await Promise.allSettled(tickers.map(function(t){return fetchLive(t).then(function(v){return{t:t,v:v};});}));
  var map={};res.forEach(function(r){if(r.status==='fulfilled'&&r.value.v)map[r.value.t]=r.value.v;});
  return map;
}

/* ── typewriter ── */
function useTW(){
  var _t=useState(''),text=_t[0],setText=_t[1];
  var _g=useState(false),going=_g[0],setGoing=_g[1];
  var iv=useRef(null);
  var play=useCallback(function(full){clearInterval(iv.current);setText('');setGoing(true);var i=0;iv.current=setInterval(function(){i+=3;if(i>=full.length){setText(full);setGoing(false);clearInterval(iv.current);}else setText(full.slice(0,i));},16);},[]);
  useEffect(function(){return function(){clearInterval(iv.current);};},[]);
  return{text:text,going:going,play:play};
}

const fmtP=function(p){if(p==null)return'—';return p<1?p.toFixed(4):p<10?p.toFixed(3):p.toFixed(2);};

/* ── candles ── */
function mkC(ticker,base){
  var s=ticker.split('').reduce(function(a,c){return a+c.charCodeAt(0);},0)*997;
  var rnd=function(){s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};
  var out=[],p=base*(0.86+rnd()*.05);
  for(var i=0;i<60;i++){var o=p,c=o*(1+(rnd()-.465)*(.013+rnd()*.022));out.push({o:o,c:c,h:Math.max(o,c)*(1+rnd()*.008),l:Math.min(o,c)*(1-rnd()*.008)});p=c;}
  return out;
}
function sma(c,n){return c.map(function(_,i){return i<n-1?null:c.slice(i-n+1,i+1).reduce(function(a,x){return a+x.c;},0)/n;});}
function calcRSI(c){
  var g=[],l=[];
  for(var i=1;i<c.length;i++){var d=c[i].c-c[i-1].c;g.push(d>0?d:0);l.push(d<0?-d:0);}
  return c.map(function(_,i){if(i<14)return null;var gv=g.slice(i-14,i).reduce(function(a,b){return a+b;},0)/14,lv=l.slice(i-14,i).reduce(function(a,b){return a+b;},0)/14;return lv===0?100:100-100/(1+gv/lv);});
}
function lvl(c){return{res:Math.max.apply(null,c.slice(-30).map(function(x){return x.h;})),sup:Math.min.apply(null,c.slice(-30).map(function(x){return x.l;}));};}

/* ── Chart ── */
function Chart({candles,price}){
  var ref=useRef(),_tip=useState(null),tip=_tip[0],setTip=_tip[1];
  var W=560,H=180,P={t:8,r:40,b:22,l:46},cw=W-P.l-P.r,ch=H-P.t-P.b;
  var all=candles.reduce(function(a,c){return a.concat([c.h,c.l]);},[]);
  var mn=Math.min.apply(null,all)*.997,mx=Math.max.apply(null,all)*1.003,rng=mx-mn;
  var tx=function(i){return P.l+(i/(candles.length-1))*cw;},ty=function(p){return P.t+ch-((p-mn)/rng)*ch;};
  var s20=sma(candles,20),s50=sma(candles,50),lv=lvl(candles);
  var bw=Math.max(2,(cw/candles.length)*.65);
  var path=function(arr){return arr.map(function(v,i){if(v==null)return'';var fi=arr.findIndex(function(x){return x!=null;});return(i===fi?'M':'L')+tx(i).toFixed(1)+','+ty(v).toFixed(1);}).join(' ');};
  var gps=[0,1,2,3,4].map(function(i){return mn+(rng*i)/4;});
  var mo=['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצ'];
  var now=new Date(),xl=[0,20,40,59].map(function(i){var d=new Date(now);d.setDate(d.getDate()-(59-i));return{i:i,l:d.getDate()+' '+mo[d.getMonth()]};});
  return(
    <svg ref={ref} width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible',cursor:'crosshair'}}
      onMouseMove={function(e){var r=ref.current.getBoundingClientRect();var mx=(e.clientX-r.left)*(W/r.width);var idx=Math.round(((mx-P.l)/cw)*(candles.length-1));if(idx>=0&&idx<candles.length){var c=candles[idx];setTip({idx:idx,o:c.o,c:c.c,h:c.h,l:c.l,y:ty(c.c)});}}}
      onMouseLeave={function(){setTip(null);}}>
      {gps.map(function(p,i){return(<g key={i}><line x1={P.l} y1={ty(p)} x2={W-P.r} y2={ty(p)} stroke="rgba(255,255,255,.04)"/><text x={P.l-3} y={ty(p)+4} textAnchor="end" fontSize="9" fill="rgba(255,255,255,.22)" fontFamily="monospace">{fmtP(p)}</text></g>);})}
      {xl.map(function(x){return(<text key={x.i} x={tx(x.i)} y={H-3} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,.22)">{x.l}</text>);})}
      <line x1={P.l} y1={ty(lv.res)} x2={W-P.r} y2={ty(lv.res)} stroke="rgba(252,129,129,.5)" strokeWidth="1" strokeDasharray="5,4"/>
      <text x={W-P.r+2} y={ty(lv.res)+4} fontSize="8" fill="rgba(252,129,129,.6)" fontFamily="monospace">{fmtP(lv.res)}</text>
      <line x1={P.l} y1={ty(lv.sup)} x2={W-P.r} y2={ty(lv.sup)} stroke="rgba(104,211,145,.5)" strokeWidth="1" strokeDasharray="5,4"/>
      <text x={W-P.r+2} y={ty(lv.sup)+4} fontSize="8" fill="rgba(104,211,145,.6)" fontFamily="monospace">{fmtP(lv.sup)}</text>
      {candles.map(function(c,i){var x=tx(i),up=c.c>=c.o,col=up?'#68d391':'#fc8181';return(<g key={i}><line x1={x} y1={ty(c.h)} x2={x} y2={ty(c.l)} stroke={col} strokeWidth=".8" opacity=".8"/><rect x={x-bw/2} y={ty(Math.max(c.o,c.c))} width={bw} height={Math.max(1.5,Math.abs(ty(c.o)-ty(c.c)))} fill={col} opacity={tip&&tip.idx===i?1:.82}/></g>);})}
      <path d={path(s20)} fill="none" stroke="#63b3ed" strokeWidth="1.5" opacity=".85"/>
      <path d={path(s50)} fill="none" stroke="#f6ad55" strokeWidth="1.5" opacity=".85"/>
      <line x1={P.l} y1={ty(price)} x2={W-P.r} y2={ty(price)} stroke="rgba(255,255,255,.2)" strokeWidth="1" strokeDasharray="3,3"/>
      {tip&&<g>
        <line x1={tx(tip.idx)} y1={P.t} x2={tx(tip.idx)} y2={H-P.b} stroke="rgba(255,255,255,.1)" strokeWidth="1" strokeDasharray="3,3"/>
        <circle cx={tx(tip.idx)} cy={ty(tip.c)} r="3" fill="#63b3ed"/>
        <rect x={Math.min(tx(tip.idx)+5,W-90)} y={tip.y-36} width="86" height="46" rx="5" fill="rgba(8,14,26,.96)" stroke="rgba(99,179,237,.25)"/>
        <text x={Math.min(tx(tip.idx)+9,W-86)} y={tip.y-22} fontSize="9" fill="rgba(255,255,255,.5)" fontFamily="monospace">פתיחה {fmtP(tip.o)}</text>
        <text x={Math.min(tx(tip.idx)+9,W-86)} y={tip.y-11} fontSize="9" fill="rgba(255,255,255,.5)" fontFamily="monospace">סגירה {fmtP(tip.c)}</text>
        <text x={Math.min(tx(tip.idx)+9,W-86)} y={tip.y-1} fontSize="9" fill={tip.c>=tip.o?'#68d391':'#fc8181'} fontFamily="monospace">{tip.c>=tip.o?'▲':'▼'}{Math.abs((tip.c-tip.o)/tip.o*100).toFixed(2)}%</text>
      </g>}
    </svg>
  );
}

function RSIChart({candles}){
  var W=560,H=44,P={t:3,r:40,b:12,l:46},cw=W-P.l-P.r,ch=H-P.t-P.b;
  var rs=calcRSI(candles),tx=function(i){return P.l+(i/(candles.length-1))*cw;},ty=function(v){return P.t+ch-(v/100)*ch;};
  var path=rs.map(function(v,i){if(v==null)return'';var fi=rs.findIndex(function(x){return x!=null;});return(i===fi?'M':'L')+tx(i).toFixed(1)+','+ty(v).toFixed(1);}).join(' ');
  var last=rs.filter(Boolean).pop()||50,col=last>70?'#fc8181':last<30?'#68d391':'#63b3ed';
  return(
    <div style={{marginTop:'4px'}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:'2px'}}>
        <span style={{fontSize:'10px',color:'rgba(255,255,255,.3)'}}>RSI (14)</span>
        <span style={{fontSize:'11px',fontWeight:'700',color:col,fontFamily:'monospace'}}>{last.toFixed(1)} {last>70?'קנוי יתר':last<30?'מכור יתר':'נייטרל'}</span>
      </div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
        {[70,50,30].map(function(v){return(<g key={v}><line x1={P.l} y1={ty(v)} x2={W-P.r} y2={ty(v)} stroke={v===50?'rgba(255,255,255,.05)':v===70?'rgba(252,129,129,.2)':'rgba(104,211,145,.2)'} strokeWidth="1" strokeDasharray={v!==50?'4,3':'none'}/><text x={P.l-3} y={ty(v)+3} textAnchor="end" fontSize="8" fill="rgba(255,255,255,.2)" fontFamily="monospace">{v}</text></g>);})}
        <path d={path} fill="none" stroke={col} strokeWidth="1.5" opacity=".9"/>
      </svg>
    </div>
  );
}

function Panel({onClose,border,children}){
  return(<>
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:250}} onClick={onClose}/>
    <div dir="rtl" style={{position:'fixed',top:0,right:0,height:'100dvh',width:'min(680px,100vw)',background:'#080e1a',borderLeft:`1px solid ${border}`,display:'flex',flexDirection:'column',zIndex:300,animation:'slideIn .3s ease',boxShadow:'-20px 0 60px rgba(0,0,0,.7)',paddingTop:'max(env(safe-area-inset-top,44px),44px)'}}>
      {children}
    </div>
  </>);
}

function ChartPanel({stock,onClose,liveMap}){
  var tw=useTW(),text=tw.text,going=tw.going,play=tw.play;
  var _ld=useState(false),ld=_ld[0],setLd=_ld[1];
  var live=liveMap[stock.ticker];
  var price=live?live.price:stock.price,change=live?live.change:stock.change;
  var candles=mkC(stock.ticker,price),lv=lvl(candles);
  var s20=sma(candles,20),lastRsi=calcRSI(candles).filter(Boolean).pop()||50;
  var run=useCallback(async function(){
    setLd(true);
    try{play(await ask('נתח '+stock.ticker+' ('+stock.name+') בעברית:\nמחיר: $'+fmtP(price)+', שינוי: '+change.toFixed(2)+'%\nתמיכה: $'+fmtP(lv.sup)+', התנגדות: $'+fmtP(lv.res)+', RSI: '+lastRsi.toFixed(1)+'\n3 פסקאות ללא כוכביות: מצב מחיר, אינדיקטורים, תרחיש מסחר'));}
    catch(e){play('שגיאה: '+e.message);}
    setLd(false);
  },[stock.ticker,price]);
  useEffect(function(){run();},[run]);
  var busy=ld||going;
  return(
    <Panel onClose={onClose} border="rgba(99,179,237,.2)">
      <div style={{padding:'12px 18px',borderBottom:'1px solid rgba(255,255,255,.06)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <span style={{fontFamily:'monospace',fontSize:'17px',fontWeight:'700',color:'#63b3ed'}}>{stock.ticker}</span>
          <span style={{fontSize:'11px',color:'rgba(255,255,255,.4)'}}>{stock.name}</span>
          <span style={{fontSize:'12px',fontWeight:'700',color:change>=0?'#68d391':'#fc8181',fontFamily:'monospace'}}>{change>=0?'▲':'▼'}{Math.abs(change).toFixed(2)}%</span>
          {live&&<span style={{fontSize:'8px',color:'#68d391',background:'rgba(104,211,145,.1)',padding:'1px 5px',borderRadius:'4px'}}>●LIVE</span>}
          {live&&live.extLabel&&<span style={{fontSize:'9px',color:'rgba(255,255,255,.5)',background:'rgba(255,255,255,.07)',padding:'1px 6px',borderRadius:'3px'}}>🌙{live.extLabel} {live.extChange>=0?'▲':'▼'}{Math.abs(live.extChange||0).toFixed(2)}%</span>}
        </div>
        <button onClick={onClose} style={{background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.18)',color:'#f7fafc',cursor:'pointer',padding:'6px 14px',borderRadius:'8px',fontSize:'13px',fontWeight:'600'}}>✕ סגור</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'14px 16px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'7px',marginBottom:'10px'}}>
          {[{l:'תמיכה',v:'$'+fmtP(lv.sup),c:'#68d391'},{l:'מחיר',v:'$'+fmtP(price),c:'#f7fafc'},{l:'התנגדות',v:'$'+fmtP(lv.res),c:'#fc8181'}].map(function(x){return(
            <div key={x.l} style={{background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.07)',borderRadius:'9px',padding:'8px',textAlign:'center'}}>
              <div style={{fontSize:'9px',color:'rgba(255,255,255,.3)',marginBottom:'2px'}}>{x.l}</div>
              <div style={{fontSize:'13px',fontWeight:'700',color:x.c,fontFamily:'monospace'}}>{x.v}</div>
            </div>
          );})}
        </div>
        <div style={{background:'rgba(0,0,0,.3)',borderRadius:'10px',padding:'10px',marginBottom:'6px',border:'1px solid rgba(255,255,255,.05)'}}>
          <Chart candles={candles} price={price}/>
        </div>
        <div style={{background:'rgba(0,0,0,.3)',borderRadius:'10px',padding:'9px 10px',marginBottom:'10px',border:'1px solid rgba(255,255,255,.05)'}}>
          <RSIChart candles={candles}/>
        </div>
        <div style={{background:'rgba(99,179,237,.04)',border:'1px solid rgba(99,179,237,.15)',borderRadius:'10px',padding:'12px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
              <div style={{width:'6px',height:'6px',borderRadius:'50%',background:'#63b3ed',animation:busy?'pulse 1s infinite':'none'}}/>
              <span style={{fontSize:'11px',color:'#63b3ed',fontWeight:'600'}}>ניתוח AI {busy&&<span style={{fontSize:'9px',opacity:.5}}>• כותב...</span>}</span>
            </div>

  var lp=function(t){var lv=liveMap[t&&t.toUpperCase()];return lv?lv.price:(allStocks[t&&t.toUpperCase()]?allStocks[t.toUpperCase()].price:null);};
  var soldSet=new Set(lots.filter(function(l){return l.done;}).map(function(l){return l.ticker.toUpperCase();}));
  var enrich=function(lot){
    if(lot.done){var pnl=(lot.sell-lot.buy)*lot.shares;return Object.assign({},lot,{pnl:pnl,pnlPct:((lot.sell-lot.buy)/lot.buy)*100});}
    var price=lp(lot.ticker),cost=lot.buy*lot.shares,value=price?price*lot.shares:null,pnl=value!=null?value-cost:null;
    return Object.assign({},lot,{price:price,cost:cost,value:value,pnl:pnl,pnlPct:cost>0&&pnl!=null?(pnl/cost)*100:null,isRepeat:soldSet.has(lot.ticker.toUpperCase())});
  };
  var active=lots.filter(function(l){return!l.done;}).map(enrich);
  var done=lots.filter(function(l){return l.done;}).map(enrich);

    setLots(function(p){return p.concat([{id:id,ticker:nl.ticker.toUpperCase().trim(),shares:+nl.shares,buy:+nl.buy,sell:nl.done&&nl.sell?+nl.sell:null,done:nl.done,date:nl.date||new Date().toISOString().slice(0,10)}]);});

  var rm=function(id){setLots(function(p){return p.filter(function(l){return l.id!==id;});});};

  var diagnose=async function(){

    {key:'mid', label:'🟠 ממותן / המתן',color:'#f6ad55',rgb:'246,173,85', filter:function(s){return s.watchScore>=4&&s.watchScore<7;}},
    {key:'weak',label:'🔴 התרחק',        color:'#fc8181',rgb:'252,129,129',filter:function(s){return s.watchScore<4;}},
  ];
  return(<div>
    {groups.map(function(g){
      var list=stocks.filter(g.filter).sort(function(a,b){return b.watchScore-a.watchScore;});
      if(!list.length)return null;
      return(<div key={g.key} style={{marginBottom:'22px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}}>

        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:'10px'}}>

}

function Card({s,i,accent,aRgb,onChart}){

    onMouseEnter={function(e){e.currentTarget.style.background='rgba('+aRgb+',.08)';e.currentTarget.style.transform='translateY(-2px)';}}
    onMouseLeave={function(e){e.currentTarget.style.background='rgba('+aRgb+',.03)';e.currentTarget.style.transform='';}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}}>
      <div>
        <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'2px'}}>

          {s.sector&&<span style={{fontSize:'9px',padding:'1px 5px',background:'rgba('+aRgb+',.12)',borderRadius:'20px',color:'rgba(255,255,255,.4)'}}>{s.sector}</span>}
          {s.isLive&&<span style={{fontSize:'8px',color:'#68d391',background:'rgba(104,211,145,.1)',padding:'1px 4px',borderRadius:'3px'}}>●LIVE</span>}
        </div>
        <div style={{fontSize:'11px',color:'rgba(255,255,255,.4)'}}>{s.name}</div>
      </div>
      <div style={{textAlign:'left'}}>
        <div style={{fontSize:'16px',fontWeight:'700',fontFamily:'monospace',color:'#f7fafc'}}>${fmtP(s.price)}</div>
        <div style={{fontSize:'12px',fontWeight:'700',color:pos?'#68d391':'#fc8181',fontFamily:'monospace'}}>{pos?'▲':'▼'}{Math.abs(s.change).toFixed(2)}%</div>
        {hasExt&&<div style={{display:'flex',alignItems:'center',gap:'3px',marginTop:'2px',justifyContent:'flex-end'}}>
          <span style={{fontSize:'9px',color:'rgba(255,255,255,.4)',background:'rgba(255,255,255,.07)',padding:'1px 5px',borderRadius:'3px'}}>🌙{s.extLabel}</span>
          <span style={{fontSize:'10px',color:extPos?'#68d391':'#fc8181',fontFamily:'monospace',fontWeight:'600'}}>{extPos?'▲':'▼'}{Math.abs(s.extChange||0).toFixed(2)}%</span>
        </div>}
      </div>
    </div>
    <button onClick={function(){onChart(s);}} style={{width:'100%',padding:'7px',background:'rgba('+aRgb+',.1)',border:'1px solid rgba('+aRgb+',.22)',borderRadius:'7px',color:accent,fontSize:'12px',cursor:'pointer'}}
      onMouseEnter={function(e){e.currentTarget.style.background='rgba('+aRgb+',.22)';}}
      onMouseLeave={function(e){e.currentTarget.style.background='rgba('+aRgb+',.1)';}}>
      📊 ניתוח גרף + AI ←
    </button>
  </div>);
}

  },[]);

  useEffect(function(){refresh();},[]);
  useEffect(function(){var iv=setInterval(refresh,60000);return function(){clearInterval(iv);};},[refresh]);
