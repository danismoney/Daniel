function fmt(p) {
  if (p == null || isNaN(p)) return '—';
  p = parseFloat(p);
  if (Math.abs(p) < 1)  return p.toFixed(4);
  if (Math.abs(p) < 10) return p.toFixed(3);
  return p.toFixed(2);
}
function fmtMoney(n) { return '$' + Math.abs(n).toLocaleString('en', {maximumFractionDigits:0}); }
function fmtTime(d)  { return d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }
function fmtDate(d)  { return d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function getKey()    { return localStorage.getItem('dm_key') || ''; }

function el(tag, props, children) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function(k) {
    if (k === 'style' && typeof props[k] === 'object') Object.assign(e.style, props[k]);
    else if (k === 'className') e.className = props[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else e.setAttribute(k, props[k]);
  });
  if (children) (Array.isArray(children) ? children : [children]).forEach(function(c) {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return e;
}

// ═══════════════════════════════════════
// WORKER — מחירים
// ═══════════════════════════════════════
async function fetchPrice(ticker) {
  try {
    var r = await fetch(WORKER + '?ticker=' + encodeURIComponent(ticker), { cache:'no-store' });
    if (!r.ok) return null;
    var d = await r.json();
    if (d.error || !d.price) return null;
    return {
      price:        parseFloat(d.price),
      change:       parseFloat(d.change || 0),
      changeAbs:    parseFloat(d.changeAbs || 0),
      high:         parseFloat(d.high || 0)      || null,
      low:          parseFloat(d.low || 0)       || null,
      open:         parseFloat(d.open || 0)      || null,
      prevClose:    parseFloat(d.prevClose || 0) || null,
      volume:       d.volume || null,
      prePrice:     d.prePrice     ? parseFloat(d.prePrice)     : null,
      preChangePct: d.preMarketChangePercent ? parseFloat(d.preMarketChangePercent) : 0,
      postPrice:    d.postPrice    ? parseFloat(d.postPrice)    : null,
      postChangePct:d.postMarketChangePercent ? parseFloat(d.postMarketChangePercent) : 0,
      state:        d.state || null
    };
  } catch(e) { return null; }
}

async function fetchAllPrices(tickers, onEach) {
  var promises = tickers.map(function(t) {
    return fetchPrice(t).then(function(v) {
      if (v) onEach(t, v);
      return { t:t, ok:!!v };
    }).catch(function() { return {t:t, ok:false}; });
  });
  var results = await Promise.allSettled(promises);
  return results.filter(function(r){ return r.status==='fulfilled' && r.value.ok; }).length;
}

// ═══════════════════════════════════════

async function fetchNews(ticker) {
  try {
    var r = await fetch(WORKER + '?news=' + encodeURIComponent(ticker), { cache: 'no-store' });
    if (!r.ok) return [];
    var d = await r.json();
    return Array.isArray(d.news) ? d.news : (Array.isArray(d) ? d : []);
  } catch(e) { return []; }
}

// ═══════════════════════════════════════
// WORKER — AI (Claude דרך ה-Worker)
// ═══════════════════════════════════════
async function callAI(prompt, maxTokens) {
  var key = getKey();
  if (!key) throw new Error('אין API key');

  var r = await fetch(WORKER, {
    method: 'POST',
    headers: {
      'Content-Type':      'application/json',
      'x-api-key':         key,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model:      'claude-haiku-4-5-20251001',
      max_tokens: maxTokens || 700,
      messages:   [{ role: 'user', content: prompt }]
    })
  });

  var raw = await r.text();
  if (!r.ok) {
    var msg = 'שגיאה ' + r.status;
    try { var ej = JSON.parse(raw); msg = (ej.error && (ej.error.message || ej.error)) || ej.message || msg; } catch(e2) {}
    throw new Error(msg);
  }

  var d;
  try { d = JSON.parse(raw); } catch(e) { return raw; }
  if (d.content && Array.isArray(d.content)) return d.content.map(function(b) { return b.text || ''; }).join('');
  if (d.text)     return d.text;
  if (d.response) return d.response;
  if (d.result)   return d.result;
  return raw;
}

function typewrite(tw, full, onTick) {
  clearInterval(tw.iv);
  tw.text = ''; tw.running = true;
  var i = 0;
  tw.iv = setInterval(function() {
    i = Math.min(i + 4, full.length);
    tw.text = full.slice(0, i);
    if (i >= full.length) { tw.running = false; clearInterval(tw.iv); }
    onTick();
  }, 14);
}

function makeCandles(ticker, base) {
  var s = ticker.split('').reduce(function(a,c){return a+c.charCodeAt(0);},0)*997;
  function rnd(){s=(s*1664525+1013904223)>>>0;return s/0xffffffff;}
  var out=[], p=base*(0.9+rnd()*0.05);
  for(var i=0;i<60;i++){
    var o=p, c=o*(1+(rnd()-0.468)*(0.012+rnd()*0.02));
    out.push({o:o,c:c,h:Math.max(o,c)*(1+rnd()*0.007),l:Math.min(o,c)*(1-rnd()*0.007)});
    p=c;
  }
  if (out.length) out[out.length-1].c = base;
  return out;
}
function calcLevels(candles) {
  var s = candles.slice(-30);
  return {
    res: Math.max.apply(null, s.map(function(c){return c.h;})),
    sup: Math.min.apply(null, s.map(function(c){return c.l;}))
  };
}
function calcRSI(candles) {
  var g=[], l=[];
  for(var i=1;i<candles.length;i++){var d=candles[i].c-candles[i-1].c;g.push(d>0?d:0);l.push(d<0?-d:0);}
  return candles.map(function(_,i){
    if(i<14)return null;
    var ag=g.slice(i-14,i).reduce(function(a,b){return a+b;},0)/14;
    var al=l.slice(i-14,i).reduce(function(a,b){return a+b;},0)/14;
    return al===0?100:100-100/(1+ag/al);
  });
}

function openChartPanel(stock) {

  var lastRSI=rsiArr.filter(function(x){return x!=null;}).pop()||50;

  var overlay=el('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,.65)',zIndex:'250',animation:'fadeIn .25s ease'}});

  function close(){document.body.removeChild(overlay);document.body.removeChild(panel);}
  overlay.onclick=close;

  // Header
  var hdr=el('div',{style:{padding:'12px 18px',borderBottom:'1px solid rgba(255,255,255,.06)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:'0'}});

  hLeft.appendChild(el('span',{style:{fontSize:'11px',color:'rgba(255,255,255,.38)'}},stock.name));
  if(price!=null){
    hLeft.appendChild(el('span',{style:{fontSize:'14px',fontWeight:'700',fontFamily:'monospace',color:'#f0f4f8'}},'$'+fmt(price)));
    hLeft.appendChild(el('span',{style:{fontSize:'12px',fontWeight:'700',color:pos?'#68d391':'#fc8181',fontFamily:'monospace'}},
      (pos?'▲':'▼')+Math.abs(change||0).toFixed(2)+'%'));
  }
  if(stock.isLive) hLeft.appendChild(el('span',{style:{fontSize:'8px',color:'#68d391',background:'rgba(104,211,145,.12)',padding:'2px 6px',borderRadius:'4px'}},'● LIVE'));
  if(stock.state&&stock.state!=='REGULAR') hLeft.appendChild(el('span',{style:{fontSize:'9px',color:'rgba(255,255,255,.45)',background:'rgba(255,255,255,.06)',padding:'2px 7px',borderRadius:'4px'}},stock.state));
  var closeBtn=el('button',{style:{background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.14)',color:'#f0f4f8',padding:'7px 14px',borderRadius:'8px',fontSize:'13px',fontWeight:'600',flexShrink:'0'}},'✕');
  closeBtn.onclick=close;
  hdr.appendChild(hLeft); hdr.appendChild(closeBtn); panel.appendChild(hdr);

  var content=el('div',{style:{flex:'1',overflowY:'auto',padding:'14px 16px',display:'flex',flexDirection:'column',gap:'10px'}});

  // Stats
  if(price!=null){
    var statsGrid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px'}});
    [
      {l:'תמיכה',   v:'$'+fmt(lv.sup),          c:'#68d391'},
      {l:'מחיר',    v:'$'+fmt(price),             c:'#f0f4f8'},
      {l:'התנגדות', v:'$'+fmt(lv.res),            c:'#fc8181'},
      {l:'פתיחה',   v:stock.open?'$'+fmt(stock.open):'—',    c:'rgba(255,255,255,.55)'},
      {l:'ס. קודמת',v:stock.prevClose?'$'+fmt(stock.prevClose):'—',c:'rgba(255,255,255,.55)'}
    ].forEach(function(s){
      var box=el('div',{style:{background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.06)',borderRadius:'9px',padding:'8px',textAlign:'center'}});
      box.appendChild(el('div',{style:{fontSize:'8px',color:'rgba(255,255,255,.28)',marginBottom:'3px'}},s.l));
      box.appendChild(el('div',{style:{fontSize:'12px',fontWeight:'700',color:s.c,fontFamily:'monospace'}},s.v));
      statsGrid.appendChild(box);
    });
    content.appendChild(statsGrid);

    // SVG chart
    var chartWrap=el('div',{style:{background:'rgba(0,0,0,.35)',borderRadius:'12px',padding:'10px',border:'1px solid rgba(255,255,255,.05)'}});
    var W=560,H=180,PL=50,PR=42,PT=8,PB=22,cw=W-PL-PR,ch=H-PT-PB;
    var allP=candles.reduce(function(a,c){return a.concat([c.h,c.l]);},[]);
    var mn=Math.min.apply(null,allP)*0.997,mx=Math.max.apply(null,allP)*1.003,rng=mx-mn;
    function tx(i){return PL+(i/(candles.length-1))*cw;}
    function ty(p){return PT+ch-((p-mn)/rng)*ch;}
    var bwW=Math.max(2.5,(cw/candles.length)*0.6);
    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','100%'); svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.style.overflow='visible'; svg.style.display='block';
    function svgEl(tag,attrs){var e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);});return e;}
    function svgTx(tag,attrs,txt){var e=svgEl(tag,attrs);e.textContent=txt;return e;}
    for(var gi=0;gi<5;gi++){
      var gp=mn+(rng*gi)/4;
      svg.appendChild(svgEl('line',{x1:PL,y1:ty(gp),x2:W-PR,y2:ty(gp),stroke:'rgba(255,255,255,.04)'}));
      svg.appendChild(svgTx('text',{x:PL-4,y:ty(gp)+4,'text-anchor':'end','font-size':'9',fill:'rgba(255,255,255,.22)','font-family':'monospace'},fmt(gp)));
    }
    svg.appendChild(svgEl('line',{x1:PL,y1:ty(lv.res),x2:W-PR,y2:ty(lv.res),stroke:'rgba(252,129,129,.5)','stroke-width':'1','stroke-dasharray':'5,4'}));
    svg.appendChild(svgTx('text',{x:W-PR+3,y:ty(lv.res)+3,'font-size':'8',fill:'rgba(252,129,129,.7)','font-family':'monospace'},'R'));
    svg.appendChild(svgEl('line',{x1:PL,y1:ty(lv.sup),x2:W-PR,y2:ty(lv.sup),stroke:'rgba(104,211,145,.5)','stroke-width':'1','stroke-dasharray':'5,4'}));
    svg.appendChild(svgTx('text',{x:W-PR+3,y:ty(lv.sup)+3,'font-size':'8',fill:'rgba(104,211,145,.7)','font-family':'monospace'},'S'));
    candles.forEach(function(c,i){
      var x=tx(i),up=c.c>=c.o,col=up?'#68d391':'#fc8181';
      var bodyH=Math.max(1.5,Math.abs(ty(c.o)-ty(c.c)));
      svg.appendChild(svgEl('line',{x1:x,y1:ty(c.h),x2:x,y2:ty(c.l),stroke:col,'stroke-width':'.8',opacity:'.7'}));
      svg.appendChild(svgEl('rect',{x:x-bwW/2,y:ty(Math.max(c.o,c.c)),width:bwW,height:bodyH,fill:col,opacity:'.85'}));
    });
    svg.appendChild(svgEl('line',{x1:PL,y1:ty(price),x2:W-PR,y2:ty(price),stroke:'rgba(255,255,255,.2)','stroke-width':'1','stroke-dasharray':'3,3'}));
    chartWrap.appendChild(svg);
    content.appendChild(chartWrap);

    // RSI
    var rsiBox=el('div',{style:{background:'rgba(0,0,0,.3)',borderRadius:'10px',padding:'10px',border:'1px solid rgba(255,255,255,.05)'}});
    var rsiCol=lastRSI>70?'#fc8181':lastRSI<30?'#68d391':'#63b3ed';
    var rsiHdr=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
    rsiHdr.appendChild(el('span',{style:{fontSize:'10px',color:'rgba(255,255,255,.3)'}},'RSI (14) — סימולציה'));
    rsiHdr.appendChild(el('span',{style:{fontSize:'11px',fontWeight:'700',color:rsiCol,fontFamily:'monospace'}},lastRSI.toFixed(1)+' · '+(lastRSI>70?'קנוי יתר':lastRSI<30?'מכור יתר':'נייטרל')));
    rsiBox.appendChild(rsiHdr);
    content.appendChild(rsiBox);
  }

  // AI Analysis
  var aiBox=el('div',{style:{background:'rgba(99,179,237,.04)',border:'1px solid rgba(99,179,237,.18)',borderRadius:'12px',padding:'14px'}});
  var aiHdr=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}});
  var aiDot=el('div',{style:{width:'7px',height:'7px',borderRadius:'50%',background:'#63b3ed',animation:'pulse 1.2s infinite',flexShrink:'0'}});
  var aiTitleRow=el('div',{style:{display:'flex',alignItems:'center',gap:'7px',flex:'1'}});
  aiTitleRow.appendChild(aiDot);
  aiTitleRow.appendChild(el('span',{style:{fontSize:'12px',color:'#63b3ed',fontWeight:'700'}},'ניתוח AI — Claude'));
  var aiStatus=el('span',{style:{fontSize:'10px',color:'rgba(255,255,255,.3)',fontStyle:'italic'}},'מנתח...');
  aiTitleRow.appendChild(aiStatus);
  var aiRefreshBtn=el('button',{style:{background:'rgba(99,179,237,.1)',border:'1px solid rgba(99,179,237,.22)',borderRadius:'7px',color:'#63b3ed',fontSize:'11px',padding:'4px 10px',display:'none'}},'🔄 רענן');
  aiHdr.appendChild(aiTitleRow); aiHdr.appendChild(aiRefreshBtn); aiBox.appendChild(aiHdr);
  var aiText=el('div',{style:{fontSize:'13px',lineHeight:'1.9',color:'rgba(255,255,255,.78)',textAlign:'right',minHeight:'60px',whiteSpace:'pre-wrap'}});
  aiBox.appendChild(aiText);
  content.appendChild(aiBox);

  var aiTW={text:'',running:false,iv:null};
  function runAnalysis(){
    aiDot.style.animation='pulse 1.2s infinite';
    aiStatus.textContent='מנתח...'; aiStatus.style.display='';
    aiRefreshBtn.style.display='none';
    aiText.textContent='';
    var now=new Date();
    var lines=[
      'נתח את המניה '+stock.ticker+' ('+stock.name+') — ענה בעברית בלבד.',
      'תאריך: '+fmtDate(now)+', שעה: '+fmtTime(now),
      'מחיר: '+(price!=null?'$'+fmt(price):'לא זמין'),
      'שינוי יומי: '+(change!=null?((change>=0?'+':'')+change.toFixed(2)+'%'+(stock.changeAbs!=null?' ($'+fmt(stock.changeAbs)+')':'')):'לא זמין'),
      stock.open    ?'פתיחה: $'+fmt(stock.open)       :'',
      stock.high    ?'גבוה: $'+fmt(stock.high)+', נמוך: $'+fmt(stock.low):'',
      stock.prevClose?'סגירה קודמת: $'+fmt(stock.prevClose):'',
      price!=null?'תמיכה: $'+fmt(lv.sup)+', התנגדות: $'+fmt(lv.res):'',
      'RSI משוער: '+lastRSI.toFixed(1),
      stock.prePrice ?'פרה-מרקט: $'+fmt(stock.prePrice)+' ('+((stock.preChangePct||0).toFixed(2))+'%)'  :'',
      stock.postPrice?'אפטר-מרקט: $'+fmt(stock.postPrice)+' ('+((stock.postChangePct||0).toFixed(2))+'%)':'',
      '',
      'כתוב 3 פסקאות קצרות, ללא כוכביות, ללא כותרות:',
      '1) מצב המחיר והמומנטום',
      '2) רמות מפתח ואינדיקטורים',
      '3) תרחיש מסחר והמלצה'
    ].filter(Boolean).join('\n');

    callAI(lines, 800)
      .then(function(res){
        if(!res||!res.trim()){aiText.textContent='לא התקבלה תשובה.';aiDot.style.animation='none';aiStatus.style.display='none';aiRefreshBtn.style.display='';return;}
        typewrite(aiTW,res.trim(),function(){
          aiText.textContent=aiTW.text;
          if(!aiTW.running){aiDot.style.animation='none';aiStatus.style.display='none';aiRefreshBtn.style.display='';}
        });
      })
      .catch(function(e){
        aiText.textContent='שגיאה: '+e.message;
        aiDot.style.animation='none'; aiStatus.style.display='none'; aiRefreshBtn.style.display='';
      });
  }
  aiRefreshBtn.onclick=runAnalysis;

  // News
  var newsBox=el('div',{style:{background:'rgba(246,173,85,.04)',border:'1px solid rgba(246,173,85,.16)',borderRadius:'12px',padding:'14px'}});
  var newsHdr=el('div',{style:{display:'flex',alignItems:'center',gap:'7px',marginBottom:'10px'}});
  newsHdr.appendChild(el('span',{style:{fontSize:'14px'}},'📰'));
  newsHdr.appendChild(el('span',{style:{fontSize:'12px',color:'#f6ad55',fontWeight:'700'}},'חדשות אחרונות'));
  var newsLoadEl=el('span',{style:{fontSize:'10px',color:'rgba(255,255,255,.3)',fontStyle:'italic',marginRight:'auto'}},'טוען...');
  newsHdr.appendChild(newsLoadEl); newsBox.appendChild(newsHdr);
  var newsList=el('div'); newsBox.appendChild(newsList); content.appendChild(newsBox);

  fetchNews(stock.ticker).then(function(items){
    newsLoadEl.style.display='none';
    if(!items||!items.length){
      newsList.appendChild(el('div',{style:{color:'rgba(255,255,255,.25)',fontSize:'12px',textAlign:'center',padding:'12px'}},'אין חדשות זמינות'));
      return;
    }
    items.slice(0,12).forEach(function(item){
      var ts = item.providerPublishTime || item.datetime || item.time || 0;
      var ago = ts ? Math.round((Date.now()/1000-ts)/3600)+"ש׳" : '';
      var a=document.createElement('a');
      a.href=item.link||item.url||'#'; a.target='_blank'; a.rel='noopener noreferrer';
      Object.assign(a.style,{display:'block',padding:'9px 0',borderBottom:'1px solid rgba(255,255,255,.06)',textDecoration:'none',cursor:'pointer'});
      a.appendChild(el('div',{style:{fontSize:'12px',color:'rgba(255,255,255,.82)',lineHeight:'1.55',marginBottom:'4px'}},item.title||item.headline||''));
      var meta=el('div',{style:{display:'flex',gap:'10px',fontSize:'10px',color:'rgba(255,255,255,.3)'}});
      var src=item.publisher||item.source||'';
      if(src) meta.appendChild(el('span',null,src));
      if(ago) meta.appendChild(el('span',null,ago+' לפני'));
      a.appendChild(meta);
      newsList.appendChild(a);
    });
  }).catch(function(e){newsLoadEl.textContent='שגיאה: '+e.message;});

  panel.appendChild(content);
  document.body.appendChild(overlay);
  document.body.appendChild(panel);
  runAnalysis();
}

      btn.onclick=function(){currentTab=k;search='';render();};tabBar2.appendChild(btn);
    });
    wrap.appendChild(tabBar2);

    if(currentTab==='rockets'){
      var banner=el('div',{style:{background:'rgba(104,211,145,.06)',border:'1px solid rgba(104,211,145,.2)',borderRadius:'11px',padding:'13px 16px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'14px'}});
      banner.appendChild(el('span',{style:{fontSize:'28px',animation:'bounce 1.6s ease-in-out infinite',display:'block',flexShrink:'0'}},'🚀'));
      var bd=el('div');
      bd.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'700',color:'#68d391',marginBottom:'3px'}},'מניות שזועות מעל 10%'));
      bd.appendChild(el('div',{style:{fontSize:'11px',color:'rgba(255,255,255,.38)'}},rockets.length>0?rockets.length+' מניות · רענון בעוד '+countdown+'s':'אין כרגע · רענון בעוד '+countdown+'s'));
      banner.appendChild(bd);wrap.appendChild(banner);
    }

    var sec=SECTIONS[currentTab]||SECTIONS.myport;
    var display;
    if(currentTab==='rockets'){
      display=rockets;
    } else {
      var q=search.trim().toUpperCase();
      display=Object.keys(ALL_STOCKS).filter(function(t){
        if(ALL_STOCKS[t].section!==currentTab)return false;
        if(!q)return true;
        return t.indexOf(q)>=0||(ALL_STOCKS[t].name||'').toLowerCase().indexOf(search.toLowerCase())>=0;
      }).map(getStock);
    }

    if(currentTab==='watch'){
      [{label:'💚 שווה לקנות (7-10)',color:'#68d391',rgb:'104,211,145',test:function(s){return s.watchScore>=7;}},
       {label:'🟠 ממותן — המתן (4-6)',color:'#f6ad55',rgb:'246,173,85',test:function(s){return s.watchScore>=4&&s.watchScore<7;}},
       {label:'🔴 התרחק (1-3)',color:'#fc8181',rgb:'252,129,129',test:function(s){return s.watchScore<4;}}
      ].forEach(function(g){
        var list=display.filter(g.test).sort(function(a,b){return b.watchScore-a.watchScore;});
        if(!list.length)return;
        var sec2=el('div',{style:{marginBottom:'24px'}});
        var h2=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
        h2.appendChild(el('span',{style:{fontSize:'12px',color:g.color,fontWeight:'700',whiteSpace:'nowrap'}},g.label));
        h2.appendChild(el('div',{style:{height:'1px',flex:'1',background:'rgba('+g.rgb+',.18)'}}));
        h2.appendChild(el('span',{style:{fontSize:'10px',color:'rgba('+g.rgb+',.7)',background:'rgba('+g.rgb+',.1)',padding:'1px 9px',borderRadius:'20px'}},list.length+''));
        sec2.appendChild(h2);
        var grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(255px,1fr))',gap:'10px'}});
        list.forEach(function(s){grid.appendChild(makeWatchCard(s,g,openChartPanel));});
        sec2.appendChild(grid);wrap.appendChild(sec2);
      });
    } else if(display.length>0){
      if(currentTab!=='rockets'){
        var sHdr=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
        sHdr.appendChild(el('span',{style:{fontSize:'11px',color:sec.accent,fontWeight:'700',whiteSpace:'nowrap'}},sec.label));
        sHdr.appendChild(el('div',{style:{height:'1px',flex:'1',background:'rgba('+sec.rgb+',.14)'}}));
        sHdr.appendChild(el('span',{style:{fontSize:'10px',color:'rgba('+sec.rgb+',.6)',background:'rgba('+sec.rgb+',.08)',padding:'1px 8px',borderRadius:'20px'}},display.length+''));
        wrap.appendChild(sHdr);
      }
      var grid3=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(255px,1fr))',gap:'10px'}});
      display.forEach(function(s){grid3.appendChild(makeStockCard(s,sec.accent,sec.rgb,openChartPanel));});
      wrap.appendChild(grid3);
    } else {
      var empty=el('div',{style:{textAlign:'center',padding:'60px 20px'}});
      empty.appendChild(el('div',{style:{fontSize:'40px',marginBottom:'12px'}},currentTab==='rockets'?'😴':'🔍'));
      empty.appendChild(el('div',{style:{color:'rgba(255,255,255,.22)',fontSize:'13px'}},currentTab==='rockets'?'אין מניות מעל 10%':'לא נמצאו תוצאות'));
      wrap.appendChild(empty);
    }
    wrap.appendChild(el('div',{style:{textAlign:'center',fontSize:'10px',color:'rgba(255,255,255,.1)',marginTop:'28px'}},"Dani's Money · נתונים: Twelve Data · AI: Claude · למטרות מידע בלבד"));
    root.appendChild(wrap);
  }

  async function doRefresh(){
    if(isRefreshing)return;
    isRefreshing=true; countdown=REFRESH;
    render();
    try {
      var count = await fetchAllPrices(Object.keys(ALL_STOCKS), function(t,v){
        G.live[t]=v;
        G.lastUpdate=new Date();
      });
      console.log('[Worker] קיבלתי '+count+' מחירים מתוך '+Object.keys(ALL_STOCKS).length);
    } catch(e){ console.error('[Worker] שגיאה:',e); }
    isRefreshing=false;
    render();
    if(!G.sumTW.running && Date.now()-G.sumLoaded > 5*60*1000) loadSummary();
  }

  async function loadSummary(){
    if(G.sumTW.running)return;
    G.sumLoaded=Date.now();
    var myT=['SMX','PGY','QUBT','BYND','LUMN','MNDY'];
    var data=myT.map(function(t){
      var s=getStock(t);
      return t+': '+(s.price!=null?'$'+fmt(s.price)+' ('+(s.change!=null?(s.change>=0?'+':'')+s.change.toFixed(2)+'%':'-')+')':'—');
    }).join(', ');
    var now=new Date();
    try{
      var res=await callAI(
        'סיכום שוק קצר בעברית בלבד — 2 משפטים, עד 50 מילים, ללא כוכביות.\n'+
        'תאריך: '+fmtDate(now)+' שעה: '+fmtTime(now)+'.\n'+
        'תיק Dani: '+data+'.\nהיה ישיר ותובנתי.',
        250
      );
      if(res&&res.trim()) typewrite(G.sumTW,res.trim(),function(){render();});
    }catch(e){G.sumTW.text='שגיאת AI: '+e.message;render();}
  }

  // Countdown — מעדכן span בלבד, לא re-render מלא
  if(countdownIv)clearInterval(countdownIv);
  countdownIv=setInterval(function(){
    if(!isRefreshing){
      countdown=Math.max(0,countdown-1);
      var cd=document.getElementById('dm-cd');
      if(cd) cd.textContent=countdown+'s';
    }
    if(countdown<=0&&!isRefreshing) doRefresh();
  },1000);

  render();
  doRefresh();
}

// ═══════════════════════════════════════
// BOOT
// ═══════════════════════════════════════
window.addEventListener('load', function(){
  var key = localStorage.getItem('dm_key');
  if (key && key.startsWith('sk-ant')) {
    initApp();
  } else {
    if (key) document.getElementById('apiKeyInput').value = key;
    document.getElementById('keyScreen').style.display = 'flex';
  }
});
</script>
