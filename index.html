<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dani's Money - Live Markets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: #0a0f1a;
        color: #eef2ff;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top, 16px));
        padding-bottom: 40px;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
    }

    /* key screen */
    .key-screen {
        position: fixed;
        inset: 0;
        background: #0a0f1a;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .key-card {
        background: #111827;
        border: 1px solid #2d3a5e;
        border-radius: 28px;
        padding: 28px 22px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 25px 40px rgba(0,0,0,0.4);
    }

    /* buttons & cards */
    button {
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .tab-btn {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 10px 0;
        border-radius: 14px;
        font-weight: 500;
        font-size: 13px;
        color: #9ca3af;
    }

    .tab-btn.active {
        background: rgba(99,179,237,0.12);
        border-color: rgba(99,179,237,0.5);
        color: #63b3ed;
    }

    .stock-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 16px;
        transition: all 0.2s;
    }

    .stock-card:hover {
        background: rgba(99,179,237,0.05);
        transform: translateY(-2px);
        border-color: rgba(99,179,237,0.2);
    }

    .price-up {
        color: #4ade80;
    }

    .price-down {
        color: #f87171;
    }

    /* scrollbar */
    ::-webkit-scrollbar {
        width: 4px;
    }
    ::-webkit-scrollbar-track {
        background: #1f2937;
    }
    ::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 4px;
    }

    @keyframes pulse {
        0%,100% { opacity: 0.4; }
        50% { opacity: 1; }
    }
    .live-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #4ade80;
        border-radius: 50%;
        animation: pulse 1.2s infinite;
        margin-left: 6px;
    }
    .toast {
        position: fixed;
        bottom: 24px;
        left: 16px;
        right: 16px;
        background: #111827e6;
        backdrop-filter: blur(12px);
        border-radius: 40px;
        padding: 12px 20px;
        text-align: center;
        font-size: 13px;
        z-index: 999;
        transition: opacity 0.2s;
        border: 1px solid rgba(255,255,255,0.1);
    }
</style>
</head>
<body>

<div id="keyScreen" class="key-screen" style="display: none;">
    <div class="key-card">
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="font-size: 44px;">💰</div>
            <div style="font-weight: 700; font-size: 22px; margin-top: 6px;">Dani's Money</div>
            <div style="color: #6b7280; font-size: 13px;">הכנס API Key של Anthropic (Claude)</div>
        </div>
        <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." style="width:100%; background:#1f2937; border:1px solid #374151; border-radius: 16px; padding: 12px 16px; color: white; font-family: monospace; margin-bottom: 12px;">
        <div id="keyError" style="color: #f87171; font-size: 12px; margin-bottom: 12px; display: none;"></div>
        <button id="saveKeyBtn" style="width:100%; background: #2563eb; border: none; border-radius: 40px; padding: 12px; color: white; font-weight: 600;">שמור והפעל</button>
        <div style="font-size: 10px; color: #4b5563; text-align: center; margin-top: 16px;">🔒 נשמר מקומית · אין צורך לניתוח מחירים</div>
    </div>
</div>

<div id="appRoot" class="container"></div>

<script>
    // ---------- UTILS ----------
    function formatPrice(p) {
        if (p === null || p === undefined) return '—';
        if (p < 0.1) return p.toFixed(4);
        if (p < 1) return p.toFixed(3);
        return p.toFixed(2);
    }

    function formatMoney(n) {
        return '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
    }

    function showToast(msg, type = 'info') {
        let toast = document.getElementById('globalToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'globalToast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        const color = type === 'error' ? '#f87171' : (type === 'success' ? '#4ade80' : '#60a5fa');
        toast.style.borderLeft = `4px solid ${color}`;
        toast.style.color = '#f3f4f6';
        toast.textContent = msg;
        toast.style.opacity = '1';
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => { toast.style.opacity = '0'; }, 3500);
    }

    // ---------- STORAGE & API KEY ----------
    function getApiKey() { return localStorage.getItem('dm_anthropic_key'); }
    function setApiKey(key) { localStorage.setItem('dm_anthropic_key', key); }

    // ---------- AI CALL (ANTHROPIC) via YOUR WORKER ----------
    async function callAI(prompt) {
        const key = getApiKey();
        if (!key) throw new Error('אין מפתח API');
        const response = await fetch('https://daniworker.danironen123.workers.dev', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': key,
                'anthropic-version': '2023-06-01',
            },
            body: JSON.stringify({
                model: 'claude-3-haiku-20240307',
                max_tokens: 700,
                messages: [{ role: 'user', content: prompt }]
            })
        });
        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || 'שגיאת API');
        }
        const data = await response.json();
        return data.content?.[0]?.text || '';
    }

    // ---------- LIVE PRICES (YAHOO FINANCE VIA CORS PROXY) ----------
    async function fetchLivePrice(ticker) {
        try {
            // Using a free CORS proxy (reliable for demo). For production better use your own worker.
            const proxy = 'https://cors-anywhere.herokuapp.com/';
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 7000);
            const res = await fetch(proxy + url, { signal: controller.signal });
            clearTimeout(timeout);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const result = json.chart?.result?.[0];
            if (!result) throw new Error('no data');
            const meta = result.meta;
            const price = meta.regularMarketPrice;
            const prevClose = meta.previousClose;
            const change = ((price - prevClose) / prevClose) * 100;
            return {
                price,
                change,
                state: meta.marketState || 'REGULAR',
                prePrice: meta.preMarketPrice || null,
                preChangePct: meta.preMarketChangePercent || null,
                postPrice: meta.postMarketPrice || null,
                postChangePct: meta.postMarketChangePercent || null,
            };
        } catch (err) {
            console.warn(`fetch error ${ticker}:`, err.message);
            return null;
        }
    }

    async function fetchAllPrices(tickers) {
        const results = await Promise.allSettled(tickers.map(async t => {
            const data = await fetchLivePrice(t);
            return { ticker: t, data };
        }));
        const map = {};
        results.forEach(r => {
            if (r.status === 'fulfilled' && r.value?.data) {
                map[r.value.ticker] = r.value.data;
            }
        });
        return map;
    }

    // ---------- STOCK DATABASE ----------
    const ALL_STOCKS = {
        SMX: { name: 'SMX Security Matters', sector: 'ביטחון', section: 'myport' },
        PGY: { name: 'Pagaya Technologies', sector: 'פינטק', section: 'myport' },
        QUBT: { name: 'Quantum Computing', sector: 'קוונטים', section: 'myport' },
        BYND: { name: 'Beyond Meat', sector: 'מזון', section: 'myport' },
        LUMN: { name: 'Lumen Technologies', sector: 'תקשורת', section: 'myport' },
        MNDY: { name: 'monday.com', sector: 'SaaS', section: 'myport' },
        TSLA: { name: 'Tesla', sector: 'רכב', section: 'compare' },
        NVDA: { name: 'NVIDIA', sector: 'שבבים', section: 'compare' },
        AAPL: { name: 'Apple', sector: 'טכנולוגיה', section: 'compare' },
        GOOGL: { name: 'Alphabet', sector: 'טכנולוגיה', section: 'compare' },
        AMZN: { name: 'Amazon', sector: 'מסחר', section: 'compare' },
        MSFT: { name: 'Microsoft', sector: 'תוכנה', section: 'compare' },
        META: { name: 'Meta', sector: 'מדיה', section: 'compare' },
        APP: { name: 'AppLovin', sector: 'פרסום', section: 'watch', watchScore: 8, watchNote: 'צמיחה חזקה' },
        SEDG: { name: 'SolarEdge', sector: 'אנרגיה', section: 'watch', watchScore: 7, watchNote: 'פוטנציאל התאוששות' },
        LCID: { name: 'Lucid Motors', sector: 'EV', section: 'watch', watchScore: 6, watchNote: 'מומנטום' },
        SMCI: { name: 'Super Micro', sector: 'שרתים', section: 'watch', watchScore: 7, watchNote: 'ביקוש AI' },
    };

    const SECTIONS = {
        myport: { label: '📁 תיק שלי', accent: '#a78bfa', rgb: '167,139,250' },
        compare: { label: '📊 השוואה', accent: '#63b3ed', rgb: '99,179,237' },
        watch: { label: '👁 מעקב', accent: '#f6ad55', rgb: '246,173,85' },
    };

    // default portfolio lots
    const DEFAULT_LOTS = [
        { id: 1, ticker: 'SMX', shares: 3000, buy: 5.10, sell: null, done: false, date: '2024-01-15' },
        { id: 2, ticker: 'SMX', shares: 3000, buy: 1.67, sell: null, done: false, date: '2024-06-20' },
        { id: 3, ticker: 'PGY', shares: 3000, buy: 13.97, sell: null, done: false, date: '2024-03-10' },
        { id: 4, ticker: 'QUBT', shares: 4500, buy: 11.15, sell: null, done: false, date: '2024-04-05' },
        { id: 5, ticker: 'BYND', shares: 7500, buy: 1.68, sell: null, done: false, date: '2024-02-28' },
        { id: 6, ticker: 'LUMN', shares: 1500, buy: 8.06, sell: null, done: false, date: '2024-05-12' },
        { id: 7, ticker: 'MNDY', shares: 63, buy: 181.03, sell: null, done: false, date: '2023-11-20' }
    ];

    // ---------- APP STATE ----------
    let state = {
        currentTab: 'myport',
        searchQuery: '',
        livePrices: {},     // ticker -> { price, change, ... }
        portfolioLots: null,
        aiSummary: '',
        aiSummaryLoading: false,
        lastRefresh: Date.now(),
    };

    // load portfolio from storage
    function loadPortfolio() {
        const stored = localStorage.getItem('dm_portfolio_lots');
        if (stored) {
            try { state.portfolioLots = JSON.parse(stored); } catch(e) {}
        }
        if (!state.portfolioLots) state.portfolioLots = JSON.parse(JSON.stringify(DEFAULT_LOTS));
    }
    function savePortfolio() {
        localStorage.setItem('dm_portfolio_lots', JSON.stringify(state.portfolioLots));
    }

    // helper: enrich lot with live price
    function enrichLot(lot) {
        const live = state.livePrices[lot.ticker];
        const currentPrice = live?.price ?? ALL_STOCKS[lot.ticker]?.price ?? 0;
        if (lot.done) {
            const pnl = (lot.sell - lot.buy) * lot.shares;
            return { ...lot, pnl, pnlPct: ((lot.sell - lot.buy) / lot.buy) * 100, currentPrice: lot.sell };
        }
        const cost = lot.buy * lot.shares;
        const value = currentPrice * lot.shares;
        const pnl = value - cost;
        const pnlPct = cost ? (pnl / cost) * 100 : 0;
        return { ...lot, currentPrice, cost, value, pnl, pnlPct };
    }

    // ---------- REFRESH PRICES ----------
    let refreshTimer = null;
    async function refreshPrices(showMsg = true) {
        try {
            if (showMsg) showToast('מעדכן מחירים...', 'info');
            const tickers = Object.keys(ALL_STOCKS);
            const newPrices = await fetchAllPrices(tickers);
            if (Object.keys(newPrices).length === 0) {
                if (showMsg) showToast('⚠️ לא התקבלו מחירים, נסה שוב', 'error');
            } else {
                state.livePrices = { ...state.livePrices, ...newPrices };
                if (showMsg) showToast(`✅ עודכן ${Object.keys(newPrices).length} מחירים`, 'success');
            }
        } catch (err) {
            console.error(err);
            showToast('שגיאת רשת – המחירים לא התעדכנו', 'error');
        }
        renderApp();
    }

    function startAutoRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(() => refreshPrices(false), 20000);
        refreshPrices(true);
    }

    // ---------- AI MARKET SUMMARY (typewriter) ----------
    let summaryInterval = null;
    let currentSummaryText = '';
    async function fetchAiSummary() {
        const topTickers = ['SMX', 'PGY', 'QUBT', 'BYND', 'LUMN', 'MNDY'];
        const dataPoints = topTickers.map(t => {
            const p = state.livePrices[t];
            const price = p?.price ?? 0;
            const ch = p?.change ?? 0;
            return `${t}: $${formatPrice(price)} (${ch.toFixed(2)}%)`;
        }).join(', ');
        const prompt = `סכם את מצב השוק בקצרה (2-3 משפטים) בעברית, מקצועי ומעודכן לפי הנתונים: ${dataPoints}. אל תשתמש בכוכביות.`;
        try {
            const summary = await callAI(prompt);
            currentSummaryText = summary;
            renderApp();
        } catch (err) {
            currentSummaryText = '⚠️ לא ניתן לטעון סיכום AI כרגע';
            renderApp();
        }
    }

    // ---------- RENDER UI (full virtual DOM) ----------
    function renderApp() {
        const root = document.getElementById('appRoot');
        if (!root) return;

        // build stock objects with live data
        function getStockObj(ticker) {
            const base = ALL_STOCKS[ticker];
            const live = state.livePrices[ticker] || {};
            return {
                ticker,
                name: base.name,
                sector: base.sector,
                price: live.price ?? 0,
                change: live.change ?? 0,
                isLive: !!live.price,
                watchScore: base.watchScore,
                watchNote: base.watchNote,
                prePrice: live.prePrice,
                preChangePct: live.preChangePct,
            };
        }

        const filteredStocks = Object.keys(ALL_STOCKS)
            .filter(t => ALL_STOCKS[t].section === state.currentTab)
            .filter(t => {
                const q = state.searchQuery.trim().toLowerCase();
                if (!q) return true;
                return t.toLowerCase().includes(q) || ALL_STOCKS[t].name.toLowerCase().includes(q);
            })
            .map(getStockObj);

        // sort for watchlist by score
        if (state.currentTab === 'watch') {
            filteredStocks.sort((a,b) => (b.watchScore||0) - (a.watchScore||0));
        } else {
            filteredStocks.sort((a,b) => a.ticker.localeCompare(b.ticker));
        }

        const section = SECTIONS[state.currentTab] || SECTIONS.myport;
        const accentColor = section.accent;
        const rgbColor = section.rgb;

        // render
        root.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <span style="font-size: 26px; font-weight: 800;">Dani's <span style="color: #63b3ed;">Money</span></span>
                    <div style="font-size: 11px; color: #6b7280;">מחירים חיים · עדכון אוטומטי</div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button id="refreshBtn" style="background: #1f2937; border: none; border-radius: 40px; padding: 8px 16px; color: white; display: flex; align-items: center; gap: 6px;">🔄 רענן</button>
                    <button id="portfolioBtn" style="background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3); border-radius: 40px; padding: 8px 18px; color: #a78bfa; font-weight: 600;">💼 תיק</button>
                    <button id="resetKeyBtn" style="background: transparent; border: 1px solid #374151; border-radius: 40px; padding: 8px 12px;">🔑</button>
                </div>
            </div>
            <div id="aiSummaryBox" style="background: rgba(99,179,237,0.05); border: 1px solid rgba(99,179,237,0.2); border-radius: 20px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; line-height: 1.6; color: #cbd5e6;">
                ${currentSummaryText || 'טוען סיכום AI...'}
            </div>
            <div style="margin-bottom: 20px;">
                <input type="text" id="searchInput" placeholder="🔍 חיפוש מניה..." value="${state.searchQuery.replace(/"/g, '&quot;')}" style="width:100%; background:#111827; border:1px solid #2d3a5e; border-radius: 30px; padding: 12px 18px; color: white; font-size: 14px;">
            </div>
            <div style="display: flex; gap: 8px; margin-bottom: 24px;">
                ${Object.entries(SECTIONS).map(([key, sec]) => `
                    <button class="tab-btn ${state.currentTab === key ? 'active' : ''}" data-tab="${key}" style="flex:1; background: ${state.currentTab === key ? `rgba(${sec.rgb},0.12)` : 'rgba(255,255,255,0.02)'}; border-color: ${state.currentTab === key ? `rgba(${sec.rgb},0.5)` : 'rgba(255,255,255,0.05)'}; color: ${state.currentTab === key ? sec.accent : '#9ca3af'}">${sec.label}</button>
                `).join('')}
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px;">
                ${filteredStocks.map(stock => `
                    <div class="stock-card" data-ticker="${stock.ticker}">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                            <div>
                                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                    <span style="font-weight: 700; font-size: 17px; color: ${accentColor};">${stock.ticker}</span>
                                    <span style="font-size: 10px; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 30px;">${stock.sector}</span>
                                    ${stock.isLive ? '<span class="live-dot"></span>' : ''}
                                </div>
                                <div style="font-size: 12px; color: #9ca3af; margin-top: 4px;">${stock.name}</div>
                                ${state.currentTab === 'watch' && stock.watchNote ? `<div style="font-size: 11px; margin-top: 8px; color: #f6ad55;">💡 ${stock.watchNote}</div>` : ''}
                            </div>
                            <div style="text-align: left;">
                                <div style="font-size: 18px; font-weight: 700;">$${formatPrice(stock.price)}</div>
                                <div style="font-size: 13px; font-weight: 600; ${stock.change >= 0 ? 'color: #4ade80' : 'color: #f87171'}">${stock.change >= 0 ? '▲' : '▼'} ${Math.abs(stock.change).toFixed(2)}%</div>
                                ${stock.prePrice ? `<div style="font-size: 9px; color: #6b7280; margin-top: 3px;">Pre: $${formatPrice(stock.prePrice)} ${stock.preChangePct?.toFixed(2)}%</div>` : ''}
                            </div>
                        </div>
                        <button class="analyzeBtn" data-ticker="${stock.ticker}" style="width:100%; margin-top: 6px; background: rgba(99,179,237,0.1); border: 1px solid rgba(99,179,237,0.2); border-radius: 40px; padding: 8px; color: #63b3ed; font-size: 12px; font-weight: 500;">📊 גרף + ניתוח AI</button>
                    </div>
                `).join('')}
            </div>
            ${filteredStocks.length === 0 ? `<div style="text-align: center; padding: 60px 20px; color: #6b7280;">🔍 לא נמצאו מניות</div>` : ''}
            <div style="margin-top: 40px; text-align: center; font-size: 10px; color: #374151;">Dani's Money · מידע בלבד · אין המלצת השקעה</div>
        `;

        // attach events
        document.getElementById('refreshBtn')?.addEventListener('click', () => refreshPrices(true));
        document.getElementById('portfolioBtn')?.addEventListener('click', openPortfolioModal);
        document.getElementById('resetKeyBtn')?.addEventListener('click', () => {
            localStorage.removeItem('dm_anthropic_key');
            showToast('API Key נמחק, רענן את העמוד', 'info');
            setTimeout(() => location.reload(), 1000);
        });
        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            renderApp();
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                state.currentTab = e.currentTarget.dataset.tab;
                state.searchQuery = '';
                renderApp();
            });
        });
        document.querySelectorAll('.analyzeBtn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const ticker = e.currentTarget.dataset.ticker;
                openAnalysisModal(ticker);
            });
        });
    }

    // ---------- PORTFOLIO MODAL ----------
    function openPortfolioModal() {
        const lots = state.portfolioLots.map(enrichLot);
        const activeLots = lots.filter(l => !l.done);
        const closedLots = lots.filter(l => l.done);
        const totalValue = activeLots.reduce((s, l) => s + (l.value || 0), 0);
        const totalCost = activeLots.reduce((s, l) => s + (l.cost || 0), 0);
        const totalPnl = totalValue - totalCost;
        const totalPnlPct = totalCost ? (totalPnl / totalCost) * 100 : 0;
        const realizedPnl = closedLots.reduce((s, l) => s + (l.pnl || 0), 0);

        const modalHtml = `
            <div id="portfolioModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(4px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px;">
                <div style="background:#0f172a; border-radius:32px; width:100%; max-width:560px; max-height:80vh; overflow-y:auto; padding:24px; border:1px solid #334155;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                        <h2 style="font-size:22px;">💼 תיק השקעות</h2>
                        <button id="closeModalBtn" style="background:#1e293b; border:none; border-radius:40px; width:36px; height:36px; color:white;">✕</button>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; background:#0a0f1a; border-radius:20px; padding:16px; margin-bottom:24px;">
                        <div><div style="color:#94a3b8;">שווי נוכחי</div><div style="font-size:20px; font-weight:700;">${formatMoney(totalValue)}</div></div>
                        <div><div style="color:#94a3b8;">רווח/הפסד</div><div style="font-size:20px; font-weight:700; ${totalPnl>=0?'color:#4ade80':'color:#f87171'}">${totalPnl>=0?'+':''}${formatMoney(totalPnl)} (${totalPnlPct.toFixed(1)}%)</div></div>
                        <div><div style="color:#94a3b8;">ממומש</div><div style="font-size:16px; color:${realizedPnl>=0?'#4ade80':'#f87171'}">${realizedPnl>=0?'+':''}${formatMoney(realizedPnl)}</div></div>
                        <div><div style="color:#94a3b8;">עסקאות</div><div style="font-size:16px;">${lots.length} (${closedLots.length} סגורות)</div></div>
                    </div>
                    <div style="margin-bottom:16px;"><b>📌 פוזיציות פתוחות</b></div>
                    ${activeLots.map(lot => `
                        <div style="background:#1e293b; border-radius:16px; padding:12px; margin-bottom:12px;">
                            <div style="display:flex; justify-content:space-between;"><span><b>${lot.ticker}</b> • ${lot.shares} מניות</span><span>קנייה $${formatPrice(lot.buy)}</span></div>
                            <div style="display:flex; justify-content:space-between; margin-top:8px;"><span>מחיר נוכחי: $${formatPrice(lot.currentPrice)}</span><span class="${lot.pnl>=0?'price-up':'price-down'}">${lot.pnl>=0?'+':''}${formatMoney(lot.pnl)} (${lot.pnlPct.toFixed(1)}%)</span></div>
                            <div style="margin-top:8px;"><input type="text" placeholder="מחיר מכירה" id="sellPrice_${lot.id}" style="background:#0f172a; border:1px solid #334155; border-radius:40px; padding:6px 12px; width:100px; font-size:12px;"> <button class="sellLotBtn" data-id="${lot.id}" style="background:#3b82f6; border:none; border-radius:40px; padding:6px 12px; color:white;">מכור</button></div>
                        </div>
                    `).join('')}
                    ${closedLots.length ? `<div style="margin:16px 0 8px;"><b>📜 עסקאות סגורות</b></div>` + closedLots.map(lot => `<div style="background:#0f172a; border-radius:12px; padding:10px; margin-bottom:6px;">${lot.ticker} · ${lot.shares} מניות · קניה $${formatPrice(lot.buy)} → מכירה $${formatPrice(lot.sell)} · ${lot.pnl>=0?'+':''}${formatMoney(lot.pnl)}</div>`).join('') : ''}
                    <button id="addLotBtn" style="width:100%; margin-top:20px; background:#334155; border:none; border-radius:40px; padding:12px; font-weight:600;">➕ הוסף עסקה</button>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        document.getElementById('closeModalBtn')?.addEventListener('click', () => document.getElementById('portfolioModal')?.remove());
        document.querySelectorAll('.sellLotBtn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                const input = document.getElementById(`sellPrice_${id}`);
                const sellPrice = parseFloat(input.value);
                if (isNaN(sellPrice) || sellPrice <= 0) return showToast('הכנס מחיר מכירה תקין', 'error');
                const lotIndex = state.portfolioLots.findIndex(l => l.id === id);
                if (lotIndex !== -1 && !state.portfolioLots[lotIndex].done) {
                    state.portfolioLots[lotIndex].sell = sellPrice;
                    state.portfolioLots[lotIndex].done = true;
                    savePortfolio();
                    document.getElementById('portfolioModal')?.remove();
                    openPortfolioModal();
                    renderApp();
                }
            });
        });
        document.getElementById('addLotBtn')?.addEventListener('click', () => {
            const newId = Math.max(0, ...state.portfolioLots.map(l => l.id)) + 1;
            state.portfolioLots.push({
                id: newId, ticker: 'AAPL', shares: 100, buy: 150, sell: null, done: false, date: new Date().toISOString().slice(0,10)
            });
            savePortfolio();
            document.getElementById('portfolioModal')?.remove();
            openPortfolioModal();
            renderApp();
        });
    }

    // ---------- ANALYSIS MODAL (chart + AI + news) ----------
    async function openAnalysisModal(ticker) {
        const stock = getStockObj(ticker);
        const live = state.livePrices[ticker] || {};
        const price = live.price ?? 0;
        const change = live.change ?? 0;
        const modalDiv = document.createElement('div');
        modalDiv.id = 'analysisModal';
        modalDiv.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1100; display:flex; justify-content:flex-end;';
        modalDiv.innerHTML = `
            <div style="background:#0f172a; width:100%; max-width:560px; height:100%; overflow-y:auto; padding:24px; border-left:1px solid #2d3a5e; direction:rtl;">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                    <h2>${ticker} · ${ALL_STOCKS[ticker]?.name || ''}</h2>
                    <button id="closeAnalysisBtn" style="background:#1e293b; border:none; border-radius:40px; width:36px;">✕</button>
                </div>
                <div style="background:#1e293b; border-radius:24px; padding:16px; margin-bottom:20px;">
                    <div style="font-size:32px; font-weight:700;">$${formatPrice(price)}</div>
                    <div style="font-size:18px; ${change>=0?'color:#4ade80':'color:#f87171'}">${change>=0?'▲':'▼'} ${Math.abs(change).toFixed(2)}%</div>
                </div>
                <div id="analysisContent" style="background:#111827; border-radius:20px; padding:16px; margin-bottom:16px;">טוען ניתוח AI...</div>
                <div id="newsContent" style="background:#111827; border-radius:20px; padding:16px;">📰 טוען חדשות...</div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('closeAnalysisBtn').onclick = () => modalDiv.remove();

        // AI analysis
        try {
            const prompt = `נתח את המניה ${ticker} (${ALL_STOCKS[ticker]?.name}) בעברית. מחיר נוכחי $${formatPrice(price)}, שינוי ${change.toFixed(2)}%. כתוב 3 פסקאות: מגמה, נקודות חוזק/חולשה, המלצה. ללא כוכביות.`;
            const analysis = await callAI(prompt);
            document.getElementById('analysisContent').innerHTML = `<div style="white-space:pre-wrap; line-height:1.7;">${analysis}</div>`;
        } catch(e) {
            document.getElementById('analysisContent').innerHTML = `⚠️ שגיאה: ${e.message}`;
        }
        // fake news simulation (since news api not available)
        document.getElementById('newsContent').innerHTML = `<div style="color:#9ca3af;">חדשות אחרונות (דמו):<br/>• ${ticker} נסחרת במגמה מעורבת<br/>• אנליסטים עוקבים אחרי הרבעון הקרוב</div>`;
    }

    function getStockObj(ticker) {
        const base = ALL_STOCKS[ticker] || { name: ticker, sector: '' };
        const live = state.livePrices[ticker] || {};
        return {
            ticker, name: base.name, sector: base.sector,
            price: live.price ?? 0, change: live.change ?? 0,
            isLive: !!live.price, watchScore: base.watchScore, watchNote: base.watchNote,
        };
    }

    // ---------- BOOT ----------
    window.onload = () => {
        const savedKey = localStorage.getItem('dm_anthropic_key');
        if (!savedKey || !savedKey.startsWith('sk-ant')) {
            document.getElementById('keyScreen').style.display = 'flex';
            document.getElementById('saveKeyBtn').onclick = () => {
                const key = document.getElementById('apiKeyInput').value.trim();
                if (!key.startsWith('sk-ant')) {
                    document.getElementById('keyError').textContent = 'מפתח לא תקין (חייב להתחיל ב-sk-ant)';
                    document.getElementById('keyError').style.display = 'block';
                    return;
                }
                setApiKey(key);
                document.getElementById('keyScreen').style.display = 'none';
                startApp();
            };
        } else {
            startApp();
        }
    };

    async function startApp() {
        loadPortfolio();
        startAutoRefresh();
        renderApp();
        // fetch AI summary after 1 second
        setTimeout(() => fetchAiSummary(), 1000);
        // refresh summary every 2 minutes
        setInterval(fetchAiSummary, 120000);
    }
</script>
</body>
</html>
