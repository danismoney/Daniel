/* ── timeout helper ── */
function withTimeout(p,ms){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error('timeout'));},ms);
    p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});
  });
}

/* ── live price — tries 3 proxies ── */
async function fetchLive(ticker){
  var url='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range=1d';
  var proxies=[
    'https://corsproxy.io/?'+encodeURIComponent(url),
    'https://api.allorigins.win/get?url='+encodeURIComponent(url),
    'https://corsproxy.io/?'+encodeURIComponent('https://query2.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range=1d')
  ];
  for(var pi=0;pi<proxies.length;pi++){
    try{
      var r=await withTimeout(fetch(proxies[pi]),7000);
      if(!r.ok)continue;
      var j=await r.json();
      var body=j.contents?JSON.parse(j.contents):j;
      var meta=body&&body.chart&&body.chart.result&&body.chart.result[0]&&body.chart.result[0].meta;
      if(!meta||!(meta.regularMarketPrice>0))continue;
      var price=meta.regularMarketPrice;
      var prev=meta.chartPreviousClose||meta.previousClose||price;
      var change=((price-prev)/prev)*100;
      var state=meta.marketState;
      /* ── Extended hours data ── */
      var prePrice=null,preChange=null,preChangePct=null;
      var postPrice=null,postChange=null,postChangePct=null;
      if(meta.preMarketPrice&&meta.preMarketPrice>0){
        prePrice=meta.preMarketPrice;
        preChange=meta.preMarketPrice-price;
        preChangePct=((meta.preMarketPrice-price)/price)*100;
      }
      if(meta.postMarketPrice&&meta.postMarketPrice>0){
        postPrice=meta.postMarketPrice;
        postChange=meta.postMarketPrice-price;
        postChangePct=((meta.postMarketPrice-price)/price)*100;
      }
      /* active extended session */
      var extPrice=null,extChange=null,extLabel=null;
      if(state==='PRE'&&prePrice){
        extPrice=prePrice;extChange=preChangePct;extLabel='פרה';
      }else if((state==='POST'||state==='CLOSED')&&postPrice){
        extPrice=postPrice;extChange=postChangePct;extLabel='אפטר';
      }
      return{price:price,change:change,state:state,
        prePrice:prePrice,preChange:preChange,preChangePct:preChangePct,
        postPrice:postPrice,postChange:postChange,postChangePct:postChangePct,
        extPrice:extPrice,extChange:extChange,extLabel:extLabel};
    }catch(e){continue;}
  }
  return null;
}

async function fetchAllLive(tickers){
  var res=await Promise.allSettled(tickers.map(function(t){return fetchLive(t);}));
  var map={};
  tickers.forEach(function(t,i){if(res[i].status==='fulfilled'&&res[i].value)map[t]=res[i].value;});
  return map;
}

    method:'POST',
