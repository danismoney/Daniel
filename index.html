<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Dani's Money"/>
<meta name="theme-color" content="#060b14"/>
<title>Dani's Money</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;background:#060b14;color:#f7fafc;font-family:Heebo,system-ui,sans-serif}
:root{--sat:env(safe-area-inset-top,44px)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(99,179,237,.2);border-radius:4px}
input:focus{outline:none}input::placeholder{color:rgba(255,255,255,.25)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:translateX(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Key Setup Screen -->
<div id="ks" style="display:none;position:fixed;inset:0;background:#060b14;z-index:9999;align-items:center;justify-content:center;padding:20px;padding-top:max(var(--sat),24px)">
  <div style="width:min(420px,100%);background:#0d1625;border:1px solid rgba(99,179,237,.2);border-radius:16px;padding:28px">
    <div style="font-size:24px;font-weight:700;margin-bottom:4px">💰 Dani's Money</div>
    <div style="font-size:12px;color:rgba(255,255,255,.35);margin-bottom:24px">המפתח נשמר בדפדפן שלך בלבד</div>
    <label style="font-size:11px;color:rgba(255,255,255,.5);display:block;margin-bottom:6px">
      🤖 Anthropic API Key
      <a href="https://console.anthropic.com" target="_blank" style="color:#63b3ed;margin-right:8px;font-size:10px">קבל כאן ←</a>
    </label>
    <div style="position:relative;margin-bottom:20px">
      <input id="ka" type="password" placeholder="sk-ant-api03-..."
        style="width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px 42px 10px 12px;color:#f7fafc;font-size:13px;font-family:monospace;outline:none"/>
      <button onclick="tv('ka','ea')" id="ea" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:rgba(255,255,255,.4)">👁</button>
    </div>
    <div id="ke" style="display:none;color:#fc8181;font-size:12px;margin-bottom:12px;text-align:center;padding:8px;background:rgba(252,129,129,.08);border-radius:8px"></div>
    <button onclick="sk()" style="width:100%;padding:13px;background:linear-gradient(135deg,rgba(99,179,237,.3),rgba(167,139,250,.25));border:1px solid rgba(99,179,237,.4);border-radius:10px;color:#f7fafc;font-size:15px;cursor:pointer;font-weight:700;font-family:Heebo,sans-serif;margin-bottom:12px">שמור והפעל ←</button>
    <div style="font-size:10px;color:rgba(255,255,255,.2);text-align:center;line-height:1.7">🔒 נשמר ב-localStorage בלבד · לא נשלח לשום שרת</div>
  </div>
</div>

<div id="root"></div>

<!-- Load React first, synchronously -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script>
function tv(a,b){
  var i=document.getElementById(a),btn=document.getElementById(b);
  i.type=i.type==='password'?'text':'password';
  btn.textContent=i.type==='password'?'👁':'🙈';
}
function sk(){
  var a=document.getElementById('ka').value.trim(),e=document.getElementById('ke');
  e.style.display='none';
  if(!a){e.style.display='block';e.textContent='⚠️ הכנס את ה-Key';return;}
  if(!a.startsWith('sk-ant')){e.style.display='block';e.textContent='⚠️ Key חייב להתחיל ב-sk-ant';return;}
  localStorage.setItem('dm_key',a);
  document.getElementById('ks').style.display='none';
  initApp();
}
window.clearKeys=function(){localStorage.removeItem('dm_key');location.reload();};
window.resetKey=function(){if(confirm('לאפס את ה-API Key?')){localStorage.removeItem('dm_key');location.reload();}};

function initApp(){
  // Make sure Babel and React are ready before transforming
  if(typeof Babel==='undefined'||typeof React==='undefined'||typeof ReactDOM==='undefined'){
    setTimeout(initApp,100);
    return;
  }
  var scripts=document.querySelectorAll('script[type="text/babel"]');
  scripts.forEach(function(s){
    try{
      var code=Babel.transform(s.textContent,{presets:['react']}).code;
      var fn=new Function(code);
      fn();
    }catch(err){
      console.error('Babel error:',err);
      document.getElementById('root').innerHTML='<div style="color:#fc8181;padding:20px;text-align:center;font-family:monospace">שגיאה: '+err.message+'</div>';
    }
  });
}

window.addEventListener('load',function(){
  var key=localStorage.getItem('dm_key');
  if(key&&key.startsWith('sk-ant')){
    initApp();
  } else {
    document.getElementById('ks').style.display='flex';
  }
});
</script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const AKEY=()=>localStorage.getItem('dm_key')||'';

function wt(p,ms){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error('timeout - נסה שוב'));},ms);
    p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});
  });
}

/* ── AI ישירות ל-Anthropic ── */
async function ask(prompt){
  var key=AKEY();
  if(!key)throw new Error('אין API key — לחץ ⚙️');
  var r=await wt(fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-allow-browser':'true'
    },
    body:JSON.stringify({
      model:'claude-haiku-4-5-20251001',
      max_tokens:600,
< truncated lines 128-659 >
  OTLK:{name:'Outlook Therapeutics',  price:0.3194,change:-13.68,sector:'ביוטק',     section:'watch',watchScore:2,watchNote:'ירידה חדה, סיכון גבוה'},
  BIRD:{name:'Allbirds',              price:8.50,  change:-22.87,sector:'אופנה',      section:'watch',watchScore:1,watchNote:'פשיטת רגל אפשרית'},
  ENVB:{name:'Enveric Biosciences',   price:3.37,  change:-7.67, sector:'ביוטק',     section:'watch',watchScore:2,watchNote:'הון עצמי שלילי'},
  OGEN:{name:'Oragenics',             price:0.66,  change:-6.65, sector:'ביוטק',     section:'watch',watchScore:1,watchNote:'מניית פרוטה'},
  BAESY:{name:'BAE Systems',          price:116.05,change:-5.07, sector:'ביטחון',   section:'watch',watchScore:3,watchNote:'ירידה בתקציבי ביטחון'},
  CETX:{name:'Cemtrex',               price:1.16,  change:-10.08,sector:'טכנולוגיה',section:'watch',watchScore:1,watchNote:'נפח נמוך'},
};

var CFG={
  myport: {label:'📁 שלי',    accent:'#a78bfa',rgb:'167,139,250'},
  compare:{label:'📊 השוואה', accent:'#63b3ed',rgb:'99,179,237'},
  watch:  {label:'👁 מעקב',  accent:'#f6ad55',rgb:'246,173,85'},
  rockets:{label:'🚀 טסות',  accent:'#68d391',rgb:'104,211,145'},
};

function App(){
  var [tab,setTab]=useState('myport');
  var [chart,setChart]=useState(null);
  var [port,setPort]=useState(false);
  var [search,setSearch]=useState('');
  var [liveMap,setLiveMap]=useState({});
  var [ld,setLd]=useState(false);
  var [cd,setCd]=useState(60);
  var [lr,setLr]=useState(null);
  var atw=useTW(),{text:ai,going:ag,play:ap}=atw;
  var [al,setAl]=useState(false);

  var getS=useCallback(function(t){
    var b=ALL[t],lv=liveMap[t];
    return{ticker:t,name:b.name,sector:b.sector,section:b.section,watchScore:b.watchScore,watchNote:b.watchNote,
      price:lv?lv.price:b.price,change:lv?lv.change:b.change,
      extPrice:lv?lv.extPrice:null,extChange:lv?lv.extChange:null,extLabel:lv?lv.extLabel:null,
      isLive:!!lv};
  },[liveMap]);

  var refresh=useCallback(async function(){
    setLd(true);
    var map=await fetchAll(Object.keys(ALL));
    if(Object.keys(map).length>0)setLiveMap(function(p){return Object.assign({},p,map);});
    setLr(Date.now());setCd(60);setLd(false);
  },[]);

  useEffect(function(){refresh();},[]);
  useEffect(function(){var iv=setInterval(refresh,60000);return function(){clearInterval(iv);};},[refresh]);
  useEffect(function(){var iv=setInterval(function(){setCd(function(c){return Math.max(0,c-1);});},1000);return function(){clearInterval(iv);};},[lr]);

  var summary=useCallback(async function(){
    setAl(true);
    var s=['SMX','PGY','QUBT','BYND','LUMN','MNDY'].map(function(t){var st=getS(t);return t+': $'+fmtP(st.price)+' ('+st.change.toFixed(2)+'%)';}).join(', ');
    try{ap(await ask('סיכום שוק יומי עברית, 2 משפטים עד 40 מילים. תיק: '+s+'. ישיר ותובנתי.'));}
    catch(e){ap('שגיאה: '+e.message);}
    setAl(false);
  },[getS]);

  useEffect(function(){if(lr)summary();},[lr]);

  var rockets=Object.keys(ALL).map(function(t){return getS(t);}).filter(function(s){return s.change>=10;}).sort(function(a,b){return b.change-a.change;});
  var display=tab==='rockets'?rockets:Object.keys(ALL).filter(function(t){
    if(ALL[t].section!==tab)return false;
    if(!search.trim())return true;
    return t.includes(search.toUpperCase())||ALL[t].name.toLowerCase().includes(search.toLowerCase());
  }).map(function(t){return getS(t);});

  var cur=CFG[tab],aiBusy=al||ag;

  return(<div dir="rtl" style={{minHeight:'100dvh',background:'#060b14',color:'#f7fafc',fontFamily:'Heebo,system-ui,sans-serif',padding:'14px 14px 40px',paddingTop:'calc(max(env(safe-area-inset-top,44px),44px) + 14px)'}}>
    <div style={{maxWidth:'1040px',margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}}>
        <h1 style={{fontFamily:'monospace',fontSize:'20px',fontWeight:'700'}}>Dani's <span style={{color:'#63b3ed'}}>Money</span></h1>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <div onClick={refresh} style={{display:'flex',alignItems:'center',gap:'5px',background:'rgba(0,0,0,.3)',border:'1px solid rgba(255,255,255,.07)',borderRadius:'8px',padding:'5px 10px',cursor:'pointer'}}>
            {ld?<div style={{width:'8px',height:'8px',border:'2px solid rgba(99,179,237,.2)',borderTop:'2px solid #63b3ed',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>:<div style={{width:'7px',height:'7px',borderRadius:'50%',background:'#68d391',boxShadow:'0 0 5px rgba(104,211,145,.6)'}}/>}
            <span style={{fontSize:'10px',color:'rgba(255,255,255,.35)',fontFamily:'monospace'}}>{ld?'...':cd+'s'}</span>
          </div>
          <button onClick={function(){setPort(true);}} style={{background:'rgba(167,139,250,.14)',border:'1px solid rgba(167,139,250,.3)',borderRadius:'8px',color:'#a78bfa',padding:'7px 14px',cursor:'pointer',fontSize:'13px',fontWeight:'600'}}>💼 תיק</button>
          <button onClick={function(){window.resetKey&&window.resetKey();}} style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:'8px',color:'rgba(255,255,255,.4)',padding:'7px 10px',cursor:'pointer',fontSize:'13px'}} title="החלף API Key">⚙️</button>
        </div>
      </div>
      <div style={{background:'linear-gradient(135deg,rgba(99,179,237,.07),rgba(99,179,237,.02))',border:'1px solid rgba(99,179,237,.17)',borderRadius:'9px',padding:'10px 14px',marginBottom:'11px',minHeight:'40px',display:'flex',alignItems:'center',gap:'9px'}}>
        <div style={{width:'6px',height:'6px',borderRadius:'50%',background:'#63b3ed',flexShrink:0,animation:aiBusy?'pulse 1s infinite':'none'}}/>
        <p style={{fontSize:'12px',lineHeight:'1.6',color:'rgba(255,255,255,.65)',flex:1,textAlign:'right',whiteSpace:'pre-wrap'}}>
          {aiBusy&&!ai&&<span style={{color:'rgba(255,255,255,.2)',fontStyle:'italic'}}>טוען סיכום...</span>}
          {ai}{ag&&<span style={{display:'inline-block',width:'2px',height:'1em',background:'#63b3ed',marginRight:'2px',verticalAlign:'text-bottom',animation:'blink .7s step-end infinite'}}/>}
        </p>
        {!aiBusy&&<button onClick={summary} style={{background:'none',border:'none',color:'rgba(99,179,237,.4)',cursor:'pointer',fontSize:'14px'}}>🔄</button>}
      </div>
      {tab!=='rockets'&&<input value={search} onChange={function(e){setSearch(e.target.value);}} placeholder="חיפוש מניה..." style={{width:'100%',background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:'8px',padding:'8px 12px',color:'#f7fafc',fontSize:'13px',marginBottom:'11px'}}/>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'5px',marginBottom:'14px'}}>
        {Object.entries(CFG).map(function(entry){var k=entry[0],c=entry[1];return(
          <button key={k} onClick={function(){setTab(k);setSearch('');}} style={{padding:'8px 4px',borderRadius:'8px',fontSize:'12px',cursor:'pointer',transition:'all .15s',background:tab===k?'rgba('+c.rgb+',.2)':'rgba(255,255,255,.03)',border:tab===k?'1px solid rgba('+c.rgb+',.5)':'1px solid rgba(255,255,255,.08)',color:tab===k?c.accent:'rgba(255,255,255,.4)',fontWeight:tab===k?'700':'400',position:'relative'}}>
            {c.label}
            {k==='rockets'&&rockets.length>0&&<span style={{position:'absolute',top:'-7px',right:'-4px',background:'#fc8181',color:'#fff',borderRadius:'10px',fontSize:'9px',padding:'1px 5px',fontWeight:'800'}}>{rockets.length}</span>}
          </button>
        );})}
      </div>
      {tab==='rockets'&&<div style={{background:'rgba(104,211,145,.07)',border:'1px solid rgba(104,211,145,.2)',borderRadius:'10px',padding:'12px 16px',marginBottom:'14px',display:'flex',alignItems:'center',gap:'12px'}}>
        <span style={{fontSize:'26px',animation:'bounce 1.5s ease-in-out infinite',display:'block'}}>🚀</span>
        <div>
          <div style={{fontSize:'13px',fontWeight:'700',color:'#68d391',marginBottom:'3px'}}>מניות שטסות מעל 10%</div>
          <div style={{fontSize:'11px',color:'rgba(255,255,255,.4)'}}>{rockets.length>0?rockets.length+' מניות · רענון בעוד '+cd+'s':'אין כרגע · רענון בעוד '+cd+'s'}</div>
        </div>
      </div>}
      {tab!=='rockets'&&tab!=='watch'&&<div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}}><span style={{fontSize:'11px',color:cur.accent,fontWeight:'600',whiteSpace:'nowrap'}}>{cur.label}</span><div style={{height:'1px',flex:1,background:'rgba('+cur.rgb+',.15)'}}/></div>}
      {tab==='watch'
        ?<WatchSection stocks={display} onChart={setChart}/>
        :display.length>0
          ?<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))',gap:'10px'}}>
            {display.map(function(s,i){return(<Card key={s.ticker} s={s} i={i} accent={cur.accent} aRgb={cur.rgb} onChart={setChart}/>);})}
          </div>
          :<div style={{textAlign:'center',padding:'50px 20px'}}>
            <div style={{fontSize:'36px',marginBottom:'10px'}}>{tab==='rockets'?'😴':'🔍'}</div>
            <div style={{color:'rgba(255,255,255,.25)',fontSize:'13px'}}>{tab==='rockets'?'אין מניות מעל 10% · רענון בעוד '+cd+'s':'לא נמצאו תוצאות'}</div>
          </div>
      }
      <div style={{textAlign:'center',fontSize:'10px',color:'rgba(255,255,255,.1)',marginTop:'22px'}}>למטרות מידע בלבד · אין ייעוץ פיננסי</div>
    </div>
    {chart&&<ChartPanel stock={chart} onClose={function(){setChart(null);}} liveMap={liveMap}/>}
    {port&&<Portfolio onClose={function(){setPort(false);}} liveMap={liveMap} allStocks={ALL}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

</body>
</html>
