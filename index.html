<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dani's Money - Live Markets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1a;
            color: #eef2ff;
            font-family: system-ui, 'Segoe UI', monospace;
            padding: 16px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        h1 { font-size: 28px; }
        h1 span { color: #3b82f6; }
        button, .tab {
            background: #1e293b;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }
        .tab-bar {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .tab {
            background: #0f172a;
            border: 1px solid #334155;
        }
        .tab.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .stock-card {
            background: #111827;
            border: 1px solid #2d3a5e;
            border-radius: 24px;
            padding: 16px;
            transition: 0.2s;
        }
        .stock-card:hover { transform: translateY(-2px); background: #1e293b; }
        .price { font-size: 24px; font-weight: 700; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .sector-badge {
            font-size: 10px;
            background: #334155;
            padding: 2px 8px;
            border-radius: 40px;
            display: inline-block;
        }
        input, button.simulate {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            border-radius: 40px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }
        button.simulate { background: #2563eb; border: none; cursor: pointer; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #111827;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            z-index: 999;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Dani's <span>Money</span></h1>
        <div>
            <button id="refreshBtn">🔄 רענן</button>
        </div>
    </div>
    <div class="tab-bar">
        <button class="tab active" data-tab="myport">📁 תיק שלי</button>
        <button class="tab" data-tab="compare">📊 השוואה</button>
        <button class="tab" data-tab="watch">👁 מעקב</button>
        <button class="tab" data-tab="rockets">🚀 טסות</button>
    </div>
    <div id="stocksContainer" class="stock-grid">טוען מחירים...</div>
</div>
<script>
    // ---------- STOCKS DATABASE ----------
    const ALL_STOCKS = {
        SMX: { name: "SMX Security Matters", sector: "ביטחון", section: "myport" },
        PGY: { name: "Pagaya", sector: "פינטק", section: "myport" },
        QUBT: { name: "Quantum Computing", sector: "קוונטים", section: "myport" },
        BYND: { name: "Beyond Meat", sector: "מזון", section: "myport" },
        LUMN: { name: "Lumen", sector: "תקשורת", section: "myport" },
        MNDY: { name: "monday.com", sector: "SaaS", section: "myport" },
        LI: { name: "Li Auto", sector: "רכב", section: "compare" },
        LCID: { name: "Lucid", sector: "רכב", section: "compare" },
        TSLA: { name: "Tesla", sector: "רכב", section: "compare" },
        AAPL: { name: "Apple", sector: "טכנולוגיה", section: "compare" },
        MSFT: { name: "Microsoft", sector: "טכנולוגיה", section: "compare" },
        NVDA: { name: "NVIDIA", sector: "שבבים", section: "compare" },
        APP: { name: "AppLovin", sector: "פרסום", section: "watch", watchNote: "צמיחה AI" },
        SMCI: { name: "Super Micro", sector: "שרתים", section: "watch", watchNote: "ביקוש ענק" },
        SEDG: { name: "SolarEdge", sector: "אנרגיה", section: "watch" },
    };

    let currentTab = "myport";
    let livePrices = {};      // { ticker: { price, change, afterPrice, afterChange } }

    // ---------- FETCH PRICE (Yahoo Finance via free proxy) ----------
    async function fetchPrice(ticker) {
        try {
            const proxy = "https://api.allorigins.win/get?url=";
            const target = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`;
            const res = await fetch(proxy + encodeURIComponent(target));
            if (!res.ok) return null;
            const wrapper = await res.json();
            const data = JSON.parse(wrapper.contents);
            const result = data.chart?.result?.[0];
            if (!result) return null;
            const meta = result.meta;
            const regular = meta.regularMarketPrice;
            const prevClose = meta.previousClose;
            const dayChange = ((regular - prevClose) / prevClose) * 100;
            const post = meta.postMarketPrice;
            const postChange = meta.postMarketChangePercent;
            const isAfter = meta.marketState === "POST" || meta.marketState === "CLOSED";
            return {
                price: regular,
                change: dayChange,
                afterPrice: isAfter && post ? post : null,
                afterChange: isAfter && postChange ? postChange : null,
            };
        } catch (err) {
            console.warn(ticker, err);
            return null;
        }
    }

    async function refreshAll() {
        const tickers = Object.keys(ALL_STOCKS);
        const results = await Promise.allSettled(tickers.map(t => fetchPrice(t)));
        const newMap = {};
        results.forEach((r, i) => {
            if (r.status === "fulfilled" && r.value) {
                newMap[tickers[i]] = r.value;
            }
        });
        livePrices = newMap;
        render();
    }

    // ---------- RENDER ----------
    function render() {
        const container = document.getElementById("stocksContainer");
        if (!container) return;

        let filtered = Object.keys(ALL_STOCKS).filter(t => ALL_STOCKS[t].section === currentTab);
        if (currentTab === "rockets") {
            filtered = filtered.filter(t => {
                const p = livePrices[t];
                if (!p) return false;
                return (p.afterChange && p.afterChange > 2) || p.change > 8;
            });
        } else if (currentTab !== "myport" && currentTab !== "compare" && currentTab !== "watch") {
            filtered = [];
        }

        if (filtered.length === 0) {
            container.innerHTML = "<div style='text-align:center; padding:40px;'>🔍 אין מניות בקטגוריה זו</div>";
            return;
        }

        container.innerHTML = filtered.map(ticker => {
            const stock = ALL_STOCKS[ticker];
            const p = livePrices[ticker] || { price: 0, change: 0, afterPrice: null };
            const price = p.price || 0;
            const change = p.change || 0;
            const afterPrice = p.afterPrice;
            const afterChange = p.afterChange;
            const isPos = change >= 0;
            const afterPos = afterChange >= 0;

            return `
                <div class="stock-card">
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <strong style="font-size:18px;">${ticker}</strong>
                            <div class="sector-badge">${stock.sector}</div>
                            <div style="font-size:12px; color:#9ca3af;">${stock.name}</div>
                            ${stock.watchNote ? `<div style="font-size:11px; margin-top:4px;">💡 ${stock.watchNote}</div>` : ""}
                        </div>
                        <div style="text-align:left;">
                            <div class="price">$${price.toFixed(2)}</div>
                            <div class="${isPos ? 'positive' : 'negative'}">${isPos ? "▲" : "▼"} ${Math.abs(change).toFixed(2)}%</div>
                            ${afterPrice ? `<div style="font-size:10px; color:#fbbf24;">🌙 After: $${afterPrice.toFixed(2)} ${afterPos ? "▲" : "▼"} ${Math.abs(afterChange).toFixed(2)}%</div>` : ""}
                        </div>
                    </div>
                    <input type="number" id="invest_${ticker}" placeholder="השקעה ($100-10000)" min="100" max="10000" step="100">
                    <button class="simulate" data-ticker="${ticker}">📈 חשב רווח (+50%, +100%, +200%)</button>
                </div>
            `;
        }).join("");

        // attach simulation events
        document.querySelectorAll(".simulate").forEach(btn => {
            btn.onclick = (e) => {
                const ticker = btn.dataset.ticker;
                const amount = parseFloat(document.getElementById(`invest_${ticker}`)?.value);
                if (isNaN(amount) || amount < 100 || amount > 10000) {
                    alert("הכנס סכום בין 100 ל-10,000 דולר");
                    return;
                }
                const price = livePrices[ticker]?.price;
                if (!price || price === 0) {
                    alert("מחיר לא זמין כרגע");
                    return;
                }
                const shares = amount / price;
                const targets = [1.5, 2, 3];
                let msg = `💰 השקעה $${amount} במחיר $${price.toFixed(2)}:\n`;
                targets.forEach(m => {
                    const newPrice = price * m;
                    const profit = shares * (newPrice - price);
                    msg += `🔹 עליה ל-$${newPrice.toFixed(2)} → רווח $${profit.toFixed(0)}\n`;
                });
                alert(msg);
            };
        });
    }

    // ---------- UI Events ----------
    document.querySelectorAll(".tab").forEach(btn => {
        btn.onclick = () => {
            currentTab = btn.dataset.tab;
            document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            render();
        };
    });
    document.getElementById("refreshBtn").onclick = () => {
        refreshAll();
    };

    // start
    refreshAll();
    setInterval(refreshAll, 20000);
</script>
</body>
</html>
