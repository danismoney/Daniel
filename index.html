function fmt(p) {
  if (p == null) return '—';
  if (p < 1) return p.toFixed(4);
  if (p < 10) return p.toFixed(3);
  return p.toFixed(2);
}
function fmtMoney(n) {
  return '$' + Math.abs(n).toLocaleString('en', {maximumFractionDigits:0});
}
function el(tag, props, children) {
  var e = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function(k) {
      if (k === 'style' && typeof props[k] === 'object') {
        Object.assign(e.style, props[k]);
      } else if (k === 'className') {
        e.className = props[k];
      } else if (k.startsWith('on')) {
        e.addEventListener(k.slice(2).toLowerCase(), props[k]);
      } else {
        e.setAttribute(k, props[k]);
      }
    });
  }
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach(function(c) {
      if (c == null || c === false) return;
      if (typeof c === 'string' || typeof c === 'number') {
        e.appendChild(document.createTextNode(c));
      } else {
        e.appendChild(c);
      }
    });
  }
  return e;
}
function s(obj) { return Object.assign({}, obj); }

async function callAI(prompt) {
  var key = getKey();
  if (!key) throw new Error('אין API key');
  var ctrl = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, 18000);
  try {
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: ctrl.signal,
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 700,
        messages: [{role: 'user', content: prompt}]
      })
    });
    clearTimeout(timer);
    if (!r.ok) {
      var err = await r.json().catch(function() { return {}; });
      var msg = (err.error && err.error.message) || ('שגיאה ' + r.status);
      if (r.status === 401) throw new Error('API Key לא תקין — לחץ ⚙️');
      if (r.status === 429) throw new Error('מגבלת שימוש — נסה שוב מאוחר יותר');
      throw new Error(msg);
    }
    var d = await r.json();
    return (d.content && d.content[0] && d.content[0].text) || '';
  } catch(e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('פג הזמן — נסה שוב');
    throw e;
  }
}

// ═══════════════════════════════════════

async function fetchPrice(ticker) {
  try {
    var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1d&range=1d';
    var r = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url), {signal: AbortSignal.timeout(8000)});
    if (!r.ok) return null;
    var j = await r.json();
    var data = JSON.parse(j.contents);
    var meta = data && data.chart && data.chart.result && data.chart.result[0] && data.chart.result[0].meta;
    if (!meta || !meta.regularMarketPrice) return null;
    var price = meta.regularMarketPrice;
    var prev = meta.chartPreviousClose || meta.previousClose || price;
    var change = ((price - prev) / prev) * 100;
    var state = meta.marketState;
    var extPrice = null, extChange = null, extLabel = null;
    if (state === 'PRE' && meta.preMarketPrice) {
      extPrice = meta.preMarketPrice;
      extChange = ((meta.preMarketPrice - price) / price) * 100;
      extLabel = 'פרה';
    } else if ((state === 'POST' || state === 'CLOSED') && meta.postMarketPrice) {
      extPrice = meta.postMarketPrice;
      extChange = ((meta.postMarketPrice - price) / price) * 100;
      extLabel = 'אפטר';
    }
    return {price: price, change: change, extPrice: extPrice, extChange: extChange, extLabel: extLabel};
  } catch(e) { return null; }
}

async function fetchAllPrices(tickers) {
  var results = await Promise.allSettled(tickers.map(function(t) {
    return fetchPrice(t).then(function(v) { return {t: t, v: v}; });
  }));
  var map = {};
  results.forEach(function(r) {
    if (r.status === 'fulfilled' && r.value && r.value.v) map[r.value.t] = r.value.v;
  });
  return map;
}

function typewrite(twObj, full, onUpdate) {
  clearInterval(twObj.iv);
  twObj.text = '';
  twObj.running = true;
  var i = 0;
  twObj.iv = setInterval(function() {
    i = Math.min(i + 4, full.length);
    twObj.text = full.slice(0, i);
    if (i >= full.length) { twObj.running = false; clearInterval(twObj.iv); }
    onUpdate();
  }, 14);
}

function makeCandles(ticker, base) {
  var s = ticker.split('').reduce(function(a,c){return a+c.charCodeAt(0);},0)*997;
  function rnd(){s=(s*1664525+1013904223)>>>0;return s/0xffffffff;}
  var out=[], p=base*(0.85+rnd()*0.06);
  for(var i=0;i<60;i++){
    var o=p, c=o*(1+(rnd()-0.468)*(0.012+rnd()*0.02));
    out.push({o:o,c:c,h:Math.max(o,c)*(1+rnd()*0.007),l:Math.min(o,c)*(1-rnd()*0.007)});
    p=c;
  }
  return out;
}
function calcLevels(candles){
  var s=candles.slice(-30);
  return {res:Math.max.apply(null,s.map(function(c){return c.h;})), sup:Math.min.apply(null,s.map(function(c){return c.l;}))};
}
function calcRSI(candles){
  var g=[],l=[];
  for(var i=1;i<candles.length;i++){var d=candles[i].c-candles[i-1].c;g.push(d>0?d:0);l.push(d<0?-d:0);}
  return candles.map(function(_,i){
    if(i<14)return null;
    var ag=g.slice(i-14,i).reduce(function(a,b){return a+b;},0)/14;
    var al=l.slice(i-14,i).reduce(function(a,b){return a+b;},0)/14;
    return al===0?100:100-100/(1+ag/al);
  });
}

  var cw=W-PL-PR, ch=H-PT-PB;
  var allP=candles.reduce(function(a,c){return a.concat([c.h,c.l]);},[]); 
  var mn=Math.min.apply(null,allP)*0.997, mx=Math.max.apply(null,allP)*1.003, rng=mx-mn;
  function tx(i){return PL+(i/(candles.length-1))*cw;}
  function ty(p){return PT+ch-((p-mn)/rng)*ch;}

  // RSI
  var rsiWrap = el('div',{style:{background:'rgba(0,0,0,.35)',borderRadius:'12px',padding:'10px',border:'1px solid rgba(255,255,255,.05)'}});
  var rsiCol = lastRSI>70?'#fc8181':lastRSI<30?'#68d391':'#63b3ed';
  var rsiHdr = el('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'4px'}});

  rsiHdr.appendChild(el('span',{style:{fontSize:'11px',fontWeight:'700',color:rsiCol,fontFamily:'monospace'}},lastRSI.toFixed(1)+' · '+(lastRSI>70?'קנוי יתר':lastRSI<30?'מכור יתר':'נייטרל')));
  rsiWrap.appendChild(rsiHdr);

  // AI Analysis
  var aiBox = el('div',{style:{background:'rgba(99,179,237,.04)',border:'1px solid rgba(99,179,237,.14)',borderRadius:'12px',padding:'14px'}});

  var refreshBtn = el('button',{style:{background:'rgba(99,179,237,.1)',border:'1px solid rgba(99,179,237,.2)',borderRadius:'7px',color:'#63b3ed',fontSize:'11px',padding:'4px 10px',display:'none'}},'🔄 רענן');

    try { localStorage.setItem('dm_lots', JSON.stringify(lots)); } catch(e) {}

  }

    var price=getLivePrice(lot.ticker), cost=lot.buy*lot.shares;

    return Object.assign({},lot,{price:price,cost:cost,value:value,pnl:pnl,pnlPct:cost>0&&pnl!=null?(pnl/cost)*100:null,isRepeat:soldTickers.has(lot.ticker.toUpperCase())});

    }

    if (activeTab === 'closed') {
      if (!closed.length) { contentArea.appendChild(el('div',{style:{textAlign:'center',padding:'40px',color:'rgba(255,255,255,.2)',fontSize:'13px'}},'אין עסקאות סגורות')); return; }
      closed.forEach(function(h){
        var card=el('div',{style:{background:'rgba(255,255,255,.02)',border:'1px solid rgba(255,255,255,.06)',borderRadius:'12px',padding:'12px',marginBottom:'8px'}});
        var top=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}});
        var left=el('div');
        left.appendChild(el('span',{style:{fontFamily:'monospace',fontSize:'14px',fontWeight:'700',color:'rgba(255,255,255,.4)'}},h.ticker));
        left.appendChild(el('span',{style:{fontSize:'10px',color:'rgba(255,255,255,.22)',marginRight:'10px'}},' · '+h.shares.toLocaleString()+' · '+h.date));
        var delBtn=el('button',{style:{background:'none',border:'none',color:'rgba(255,255,255,.2)',fontSize:'13px'}},'✕');
        delBtn.onclick=function(){lots=lots.filter(function(l){return l.id!==h.id;});saveLots();rebuild();};
        top.appendChild(left); top.appendChild(delBtn); card.appendChild(top);
        var grid=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px'}});
        [{l:'קניה',v:'$'+fmt(h.buy)},{l:'מכירה',v:'$'+fmt(h.sell)},{l:'רווח/הפסד',v:(h.pnl>=0?'+':'-')+fmtMoney(h.pnl),sub:(h.pnlPct>=0?'+':'')+h.pnlPct.toFixed(1)+'%',c:h.pnl>=0?'#68d391':'#fc8181'}].forEach(function(s){
          var col=s.c?s.c==='#68d391'?'104,211,145':'252,129,129':null;
          var box=el('div',{style:{background:col?'rgba('+col+',.07)':'rgba(0,0,0,.2)',border:col?'1px solid rgba('+col+',.18)':'none',borderRadius:'8px',padding:'7px',textAlign:'center'}});
          box.appendChild(el('div',{style:{fontSize:'8px',color:'rgba(255,255,255,.28)',marginBottom:'3px'}},s.l));
          box.appendChild(el('div',{style:{fontFamily:'monospace',fontSize:'12px',fontWeight:'700',color:s.c||'rgba(255,255,255,.55)'}},s.v));
          if(s.sub) box.appendChild(el('div',{style:{fontFamily:'monospace',fontSize:'10px',color:s.c}},s.sub));
          grid.appendChild(box);
        }); card.appendChild(grid);
        contentArea.appendChild(card);
      });
    }

    if (activeTab === 'add') {
      var form=el('div',{style:{background:'rgba(167,139,250,.04)',border:'1px solid rgba(167,139,250,.14)',borderRadius:'12px',padding:'16px'}});
      form.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'700',color:'rgba(255,255,255,.45)',marginBottom:'14px'}},'הוספת עסקה חדשה'));
      var inputs={};
      var iStyle={width:'100%',background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:'8px',padding:'8px 10px',color:'#f0f4f8',fontSize:'13px',fontFamily:'monospace'};
      var grid2=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'12px'}});
      [{k:'ticker',l:'טיקר',p:'AAPL'},{k:'shares',l:'מניות',p:'100'},{k:'buy',l:'מחיר קניה ($)',p:'150.00'},{k:'date',l:'תאריך',p:'2024-01-01'}].forEach(function(f){
        var wrap=el('div');
        wrap.appendChild(el('div',{style:{fontSize:'10px',color:'rgba(255,255,255,.3)',marginBottom:'4px'}},f.l));
        var inp=el('input',{style:iStyle}); inp.placeholder=f.p; inputs[f.k]=inp;
        wrap.appendChild(inp); grid2.appendChild(wrap);
      }); form.appendChild(grid2);

      var chkWrap=el('label',{style:{display:'flex',alignItems:'center',gap:'10px',cursor:'pointer',padding:'10px',background:'rgba(255,255,255,.03)',borderRadius:'8px',marginBottom:'10px'}});
      var chk=el('input',{type:'checkbox',style:{width:'16px',height:'16px',cursor:'pointer'}});
      chkWrap.appendChild(chk);
      chkWrap.appendChild(el('span',{style:{fontSize:'13px',color:'rgba(255,255,255,.55)'}},'מניה שכבר נמכרה'));
      form.appendChild(chkWrap);

      var sellWrap=el('div',{style:{marginBottom:'12px',display:'none'}});
      sellWrap.appendChild(el('div',{style:{fontSize:'10px',color:'rgba(255,255,255,.3)',marginBottom:'4px'}},'מחיר מכירה ($)'));
      var sellInp=el('input',{style:Object.assign({},iStyle,{borderColor:'rgba(252,129,129,.22)'})}); sellInp.placeholder='200.00';
      sellWrap.appendChild(sellInp); form.appendChild(sellWrap);
      chk.onchange=function(){sellWrap.style.display=chk.checked?'block':'none';};

      var addBtn=el('button',{style:{width:'100%',padding:'11px',background:'rgba(167,139,250,.18)',border:'1px solid rgba(167,139,250,.38)',borderRadius:'9px',color:'#a78bfa',fontSize:'14px',fontWeight:'700'}},'+ הוסף עסקה');
      addBtn.onclick=function(){
        if(!inputs.ticker.value||!inputs.shares.value||!inputs.buy.value)return;
        var id=Math.max.apply(null,[0].concat(lots.map(function(l){return l.id;})))+1;
        lots.push({id:id,ticker:inputs.ticker.value.toUpperCase().trim(),shares:+inputs.shares.value,buy:+inputs.buy.value,sell:chk.checked&&sellInp.value?+sellInp.value:null,done:chk.checked,date:inputs.date.value||new Date().toISOString().slice(0,10)});
        saveLots(); rebuild();
      };
      form.appendChild(addBtn);
      contentArea.appendChild(form);
    }

    if (activeTab === 'ai') {
      contentArea.appendChild(el('div',{style:{textAlign:'center',padding:'30px',color:'rgba(255,255,255,.2)',fontStyle:'italic',fontSize:'13px'}},'לחץ "אבחון AI" מלשונית פעיל'));
    }
  }

  var diagTW = {text:'', running:false, iv:null};
  function runDiagnosis(active, tP, tPct, tR) {
    var lines=active.map(function(h){return h.ticker+': '+h.shares.toLocaleString()+' מניות, קנייה $'+fmt(h.buy)+', מחיר '+(h.price?'$'+fmt(h.price):'?')+', P&L '+(h.pnlPct!=null?h.pnlPct.toFixed(1)+'%':'N/A')+(h.isRepeat?' [חוזר]':'');}).join('\n');
    contentArea.innerHTML='';
    var loading=el('div',{style:{textAlign:'center',padding:'30px',color:'rgba(255,255,255,.2)',fontStyle:'italic'}},'⏳ מנתח...');
    contentArea.appendChild(loading);

    callAI('אבחן תיק בעברית:\n'+lines+'\nP&L: '+(tP>=0?'+':'')+tPct.toFixed(1)+'%, ממומש: $'+tR.toFixed(0)+'\n3 פסקאות: מצב התיק, המניות המבטיחות, המלצות פעולה')
    .then(function(result){
      contentArea.innerHTML='';
      var box=el('div',{style:{background:'rgba(167,139,250,.04)',border:'1px solid rgba(167,139,250,.14)',borderRadius:'12px',padding:'14px'}});
      var dot=el('div',{style:{width:'7px',height:'7px',borderRadius:'50%',background:'#a78bfa',animation:'pulse 1.2s infinite',display:'inline-block',marginLeft:'7px'}});
      var hdr=el('div',{style:{display:'flex',alignItems:'center',marginBottom:'10px'}});
      hdr.appendChild(dot);
      hdr.appendChild(el('span',{style:{fontSize:'12px',color:'#a78bfa',fontWeight:'600'}},'ניתוח תיק'));
      box.appendChild(hdr);
      var txt=el('div',{style:{fontSize:'13px',lineHeight:'1.9',color:'rgba(255,255,255,.75)',textAlign:'right',whiteSpace:'pre-wrap'}});
      box.appendChild(txt);
      contentArea.appendChild(box);
      typewrite(diagTW, result, function(){
        txt.textContent=diagTW.text;
        if(!diagTW.running) dot.style.animation='none';
      });
    }).catch(function(e){
      contentArea.innerHTML='';
      contentArea.appendChild(el('div',{style:{color:'#fc8181',padding:'20px',textAlign:'center'}},'שגיאה: '+e.message));
    });
  }

  // Load lots from storage
  try { var stored=localStorage.getItem('dm_lots'); if(stored) lots=JSON.parse(stored); } catch(e) {}

  document.body.appendChild(overlay);
  document.body.appendChild(panel);
  rebuild();
}

// ═══════════════════════════════════════
// MAIN APP RENDER
// ═══════════════════════════════════════
function initApp() {
  var root = document.getElementById('root');
  var liveMap = {};
  var currentTab = 'myport';
  var search = '';
  var countdown = 60;
  var sumTW = {text:'', running:false, iv:null};

  function render() {
    root.innerHTML = '';

    var wrap = el('div', {style:{maxWidth:'1060px', margin:'0 auto'}});

    // Top bar
    var topBar = el('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}});
    var title = el('h1', {style:{fontFamily:'monospace',fontSize:'21px',fontWeight:'700'}}, "Dani's ");
    title.appendChild(el('span', {style:{color:'#63b3ed'}}, 'Money'));
    topBar.appendChild(title);

    var actions = el('div', {style:{display:'flex',alignItems:'center',gap:'8px'}});

    var refreshBtn = el('div', {style:{display:'flex',alignItems:'center',gap:'5px',background:'rgba(0,0,0,.35)',border:'1px solid rgba(255,255,255,.07)',borderRadius:'8px',padding:'6px 11px',cursor:'pointer'}});
    var dot = el('div', {style:{width:'7px',height:'7px',borderRadius:'50%',background:'#68d391',boxShadow:'0 0 6px rgba(104,211,145,.5)'}});
    refreshBtn.appendChild(dot);
    refreshBtn.appendChild(el('span', {style:{fontSize:'10px',color:'rgba(255,255,255,.32)',fontFamily:'monospace'}}, countdown+'s'));
    refreshBtn.onclick = function() { doRefresh(); };

    var portBtn = el('button', {style:{background:'rgba(167,139,250,.13)',border:'1px solid rgba(167,139,250,.28)',borderRadius:'8px',color:'#a78bfa',padding:'7px 15px',fontSize:'13px',fontWeight:'600'}}, '💼 תיק');
    portBtn.onclick = function() { openPortfolioPanel(); };

    var keyBtn = el('button', {style:{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:'8px',color:'rgba(255,255,255,.38)',padding:'7px 10px',fontSize:'14px'}}, '⚙️');
    keyBtn.onclick = function() { window.doResetKey(); };

    actions.appendChild(refreshBtn); actions.appendChild(portBtn); actions.appendChild(keyBtn);
    topBar.appendChild(actions);
    wrap.appendChild(topBar);

    // AI Summary bar
    var sumBar = el('div', {style:{background:'linear-gradient(135deg,rgba(99,179,237,.06),rgba(99,179,237,.02))',border:'1px solid rgba(99,179,237,.15)',borderRadius:'10px',padding:'11px 14px',marginBottom:'12px',minHeight:'42px',display:'flex',alignItems:'center',gap:'10px'}});
    var sumDot = el('div', {style:{width:'7px',height:'7px',borderRadius:'50%',background:'#63b3ed',flexShrink:'0',animation:sumTW.running?'pulse 1.2s infinite':'none'}});
    var sumText = el('div', {style:{fontSize:'12px',lineHeight:'1.65',color:'rgba(255,255,255,.62)',flex:'1',textAlign:'right'}});
    sumText.textContent = sumTW.text || 'טוען סיכום שוק...';
    sumBar.appendChild(sumDot); sumBar.appendChild(sumText);
    wrap.appendChild(sumBar);

    // Search
    if (currentTab !== 'rockets') {
      var searchInp = el('input', {style:{width:'100%',background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.09)',borderRadius:'9px',padding:'9px 13px',color:'#f0f4f8',fontSize:'13px',marginBottom:'12px'}});
      searchInp.placeholder = '🔍 חיפוש מניה...';
      searchInp.value = search;
      searchInp.oninput = function() { search = this.value; render(); };
      wrap.appendChild(searchInp);
    }

    // Tab bar
    var rockets = Object.keys(ALL_STOCKS).map(getStock).filter(function(s){return s.change >= 10;}).sort(function(a,b){return b.change-a.change;});
    var tabBar = el('div', {style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'5px',marginBottom:'16px'}});
    Object.keys(SECTIONS).forEach(function(k) {
      var s = SECTIONS[k];
      var active = currentTab === k;
      var btn = el('button', {style:{padding:'9px 4px',borderRadius:'9px',fontSize:'12px',fontWeight:active?'700':'400',position:'relative',background:active?'rgba('+s.rgb+',.18)':'rgba(255,255,255,.03)',border:active?'1px solid rgba('+s.rgb+',.45)':'1px solid rgba(255,255,255,.07)',color:active?s.accent:'rgba(255,255,255,.38)'}}, s.label);
      if (k === 'rockets' && rockets.length > 0) {
        var badge = el('span', {style:{position:'absolute',top:'-8px',right:'-5px',background:'#fc8181',color:'#fff',borderRadius:'10px',fontSize:'9px',padding:'1px 6px',fontWeight:'800'}}, rockets.length+'');
        btn.appendChild(badge);
      }
      btn.onclick = function() { currentTab = k; search = ''; render(); };
      tabBar.appendChild(btn);
    });
    wrap.appendChild(tabBar);

    // Rockets banner
    if (currentTab === 'rockets') {
      var banner = el('div',{style:{background:'rgba(104,211,145,.06)',border:'1px solid rgba(104,211,145,.2)',borderRadius:'11px',padding:'13px 16px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'14px'}});
      banner.appendChild(el('span',{style:{fontSize:'28px',animation:'bounce 1.6s ease-in-out infinite',display:'block',flexShrink:'0'}},'🚀'));
      var bd=el('div');
      bd.appendChild(el('div',{style:{fontSize:'13px',fontWeight:'700',color:'#68d391',marginBottom:'3px'}},'מניות שטסות מעל 10%'));
      bd.appendChild(el('div',{style:{fontSize:'11px',color:'rgba(255,255,255,.38)'}},rockets.length>0?rockets.length+' מניות · רענון בעוד '+countdown+'s':'אין כרגע · רענון בעוד '+countdown+'s'));
      banner.appendChild(bd); wrap.appendChild(banner);
    }

    // Content
    var sec = SECTIONS[currentTab] || SECTIONS.myport;
    var display;
    if (currentTab === 'rockets') {
      display = rockets;
    } else {
      var q = search.trim().toUpperCase();
      display = Object.keys(ALL_STOCKS).filter(function(t) {
        if (ALL_STOCKS[t].section !== currentTab) return false;
        if (!q) return true;
        return t.indexOf(q) >= 0 || ALL_STOCKS[t].name.toLowerCase().indexOf(search.toLowerCase()) >= 0;
      }).map(getStock);
    }

    if (currentTab === 'watch') {
      var groups = [
        {key:'buy', label:'💚 שווה לקנות', color:'#68d391', rgb:'104,211,145', test:function(s){return s.watchScore>=7;}},
        {key:'mid', label:'🟠 ממותן / המתן',color:'#f6ad55', rgb:'246,173,85',  test:function(s){return s.watchScore>=4&&s.watchScore<7;}},
        {key:'weak',label:'🔴 התרחק',       color:'#fc8181', rgb:'252,129,129', test:function(s){return s.watchScore<4;}}
      ];
      groups.forEach(function(g) {
        var list = display.filter(g.test).sort(function(a,b){return b.watchScore-a.watchScore;});
        if (!list.length) return;
        var section = el('div',{style:{marginBottom:'24px'}});
        var hdr = el('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
        hdr.appendChild(el('span',{style:{fontSize:'12px',color:g.color,fontWeight:'700',whiteSpace:'nowrap'}},g.label));
        hdr.appendChild(el('div',{style:{height:'1px',flex:'1',background:'rgba('+g.rgb+',.18)'}}));
        hdr.appendChild(el('span',{style:{fontSize:'10px',color:'rgba('+g.rgb+',.7)',background:'rgba('+g.rgb+',.1)',padding:'1px 9px',borderRadius:'20px'}},list.length+''));
        section.appendChild(hdr);
        var grid = el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(255px,1fr))',gap:'10px'}});
        list.forEach(function(s) { grid.appendChild(makeWatchCard(s, g, openChartPanel)); });
        section.appendChild(grid);
        wrap.appendChild(section);
      });
    } else if (display.length > 0) {
      if (currentTab !== 'rockets') {
        var secHdr = el('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
        secHdr.appendChild(el('span',{style:{fontSize:'11px',color:sec.accent,fontWeight:'700',whiteSpace:'nowrap'}},sec.label));
        secHdr.appendChild(el('div',{style:{height:'1px',flex:'1',background:'rgba('+sec.rgb+',.14)'}}));
        wrap.appendChild(secHdr);
      }
      var grid = el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(255px,1fr))',gap:'10px'}});
      display.forEach(function(s) { grid.appendChild(makeStockCard(s, sec.accent, sec.rgb, openChartPanel)); });
      wrap.appendChild(grid);
    } else {
      var empty = el('div',{style:{textAlign:'center',padding:'60px 20px'}});
      empty.appendChild(el('div',{style:{fontSize:'40px',marginBottom:'12px'}},currentTab==='rockets'?'😴':'🔍'));
      empty.appendChild(el('div',{style:{color:'rgba(255,255,255,.22)',fontSize:'13px'}},currentTab==='rockets'?'אין מניות מעל 10% · רענון בעוד '+countdown+'s':'לא נמצאו תוצאות'));
      wrap.appendChild(empty);
    }

    wrap.appendChild(el('div',{style:{textAlign:'center',fontSize:'10px',color:'rgba(255,255,255,.1)',marginTop:'28px'}},"Dani's Money · למטרות מידע בלבד · אין ייעוץ פיננסי"));
    root.appendChild(wrap);
  }

  // Refresh prices
  async function doRefresh() {
    try {
      var map = await fetchAllPrices(Object.keys(ALL_STOCKS));
      if (Object.keys(map).length > 0) { liveMap = Object.assign({}, liveMap, map); state.liveMap = liveMap; }
    } catch(e) {}
    countdown = 60;
    render();
    loadSummary();
  }

  async function loadSummary() {
    if (sumTW.running) return;
    var data = ['SMX','PGY','QUBT','BYND','LUMN','MNDY'].map(function(t){ var s=getStock(t); return t+': $'+fmt(s.price)+' ('+s.change.toFixed(2)+'%)'; }).join(', ');
    try {
      var result = await callAI('סיכום שוק קצר בעברית, 2 משפטים עד 45 מילים. נתונים: '+data+'. היה ישיר ותובנתי.');
      typewrite(sumTW, result, function() { render(); });
    } catch(e) {
      sumTW.text = 'שגיאה בטעינת סיכום: '+e.message;
      render();
    }
  }

  // Countdown timer
  setInterval(function() {
    countdown = Math.max(0, countdown - 1);
    var el2 = document.querySelector('#root span[data-countdown]');
    if (!el2) render();
  }, 1000);

  // Auto refresh every 60s
  setInterval(doRefresh, 60000);

  render();
  doRefresh();
}

// ═══════════════════════════════════════
// BOOT
// ═══════════════════════════════════════
window.addEventListener('load', function() {
  var key = localStorage.getItem('dm_key');
  if (key && key.startsWith('sk-ant')) {
    initApp();
  } else {
    document.getElementById('keyScreen').style.display = 'flex';
  }
});
</script>
