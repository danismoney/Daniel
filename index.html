function withTimeout(p, ms) {
  return new Promise((res, rej) => { const t = setTimeout(() => rej(new Error('t')), ms); p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); }); });
}
async function fetchLivePrice(ticker) {
  const urls = [
    'https://api.allorigins.win/get?url=' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1d&range=1d'),
    'https://corsproxy.io/?' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1d&range=1d'),
  ];
  for (const url of urls) {
    try {
      const r = await withTimeout(fetch(url), 7000);
      if (!r.ok) continue;
      const raw = await r.json();
      const body = raw.contents ? JSON.parse(raw.contents) : raw;
      const meta = body?.chart?.result?.[0]?.meta;
      if (meta?.regularMarketPrice > 0) {
        const price = meta.regularMarketPrice, prev = meta.chartPreviousClose || meta.previousClose || price;
        return { price, change: ((price - prev) / prev) * 100 };
      }
    } catch {}
  }
  return null;
}
async function fetchAllPrices(tickers) {
  const results = await Promise.allSettled(tickers.map(t => fetchLivePrice(t)));
  const map = {};
  tickers.forEach((t, i) => { if (results[i].status === 'fulfilled' && results[i].value) map[t] = results[i].value; });
  return map;
}
async function callClaude(prompt) {
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': AKEY(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 700, messages: [{ role: 'user', content: prompt }] }),
    });
    const d = await r.json();
    return d.content?.[0]?.text || '';
  } catch { return 'שגיאה.'; }
}
function useTypewriter() {
  const [text, setText] = useState(''); const [going, setGoing] = useState(false); const iv = useRef(null);
  const play = useCallback((full) => { clearInterval(iv.current); setText(''); setGoing(true); let i = 0; iv.current = setInterval(() => { i += 3; if (i >= full.length) { setText(full); setGoing(false); clearInterval(iv.current); } else setText(full.slice(0, i)); }, 18); }, []);
  useEffect(() => () => clearInterval(iv.current), []);
  return { text, going, play };
}

      </div>
    </div>
    {chartStock&&<ChartPanel stock={chartStock} onClose={()=>setChartStock(null)} liveMap={liveMap}/>}
    {showPort&&<PortfolioPanel onClose={()=>setShowPort(false)} liveMap={liveMap}/>}
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}
</script>
</body>
</html>
