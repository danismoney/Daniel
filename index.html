// ── timeout helper ──
function withTimeout(promise, ms) {
  return new Promise(function(resolve, reject) {
    var t = setTimeout(function(){ reject(new Error('timeout')); }, ms);
    promise.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
  });
}

// ── live price ──
async function fetchLivePrice(ticker) {
  var proxies = [
    'https://api.allorigins.win/get?url=' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1d&range=1d'),
    'https://corsproxy.io/?' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1d&range=1d'),
  ];
  for (var i = 0; i < proxies.length; i++) {
    try {
      var r = await withTimeout(fetch(proxies[i]), 7000);
      if (!r.ok) continue;
      var raw = await r.json();
      var body = raw.contents ? JSON.parse(raw.contents) : raw;
      var meta = body && body.chart && body.chart.result && body.chart.result[0] && body.chart.result[0].meta;
      if (meta && meta.regularMarketPrice > 0) {
        var price  = meta.regularMarketPrice;
        var prev   = meta.chartPreviousClose || meta.previousClose || price;
        var change = prev ? ((price - prev) / prev) * 100 : 0;
        return { price: price, change: change };
      }
    } catch(e) {}
  }
  return null;
}

async function fetchAllPrices(tickers) {
  var results = await Promise.allSettled(tickers.map(function(t){ return fetchLivePrice(t); }));
  var map = {};
  tickers.forEach(function(t, i) {
    if (results[i].status === 'fulfilled' && results[i].value) map[t] = results[i].value;
  });
  return map;
}

function useTypewriter() {

  var _g = useState(false), going = _g[0], setGoing = _g[1];
  var iv = useRef(null);

function generateCandles(ticker, basePrice) {
  var hash = ticker.split('').reduce(function(a,c){ return a + c.charCodeAt(0); }, 0);
  var rand = seededRand(hash * 997), out = [], price = basePrice * (0.86 + rand() * 0.05);
  for (var i = 0; i < 60; i++) {
    var vol = 0.013 + rand() * 0.022, open = price, close = open * (1 + (rand() - 0.465) * vol);
    out.push({ open: open, close: close, high: Math.max(open,close)*(1+rand()*0.008), low: Math.min(open,close)*(1-rand()*0.008) });
    price = close;
  }
  return out;
}
