<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Dani’s Money"/>
  <meta name="theme-color" content="#060b14"/>
  <title>Dani’s Money</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overscroll-behavior:none}
    body{background:#060b14;font-family:Heebo,system-ui,sans-serif;color:#f7fafc}
    :root{
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    /* תיקון המרווח העליון של כל האפליקציה */
    #root{ padding-top: 30px; }
    
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:rgba(99,179,237,0.2);border-radius:4px}
    input:focus{outline:none}
    @keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>

<div style="padding: calc(var(--sat) + 12px) 10px 12px; background: #1a1a1a; color: white; border-bottom: 1px solid #333; text-align: center; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 6px;">
        <label style="font-size: 11px; opacity: 0.7;">Anthropic:</label>
        <input type="password" id="apiKeyInput" placeholder="sk-ant-..." style="background: #333; color: white; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; width: 110px; font-size: 11px;">
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
        <label style="font-size: 11px; opacity: 0.7;">Finnhub:</label>
        <input type="password" id="finnhubKeyInput" placeholder="Key" style="background: #333; color: white; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; width: 100px; font-size: 11px;">
    </div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const getAnthropicKey = () => document.getElementById('apiKeyInput').value;
const getFinnhubKey = () => document.getElementById('finnhubKeyInput').value;

const initKeyStorage = () => {
    const fields = [
        { id: 'apiKeyInput', storageKey: 'saved_anthropic' },
        { id: 'finnhubKeyInput', storageKey: 'saved_finnhub' }
    ];
    fields.forEach(field => {
        const input = document.getElementById(field.id);
        if (!input) return;
        const savedValue = localStorage.getItem(field.storageKey);
        if (savedValue) input.value = savedValue;
        input.addEventListener('input', (e) => localStorage.setItem(field.storageKey, e.target.value));
    });
};
window.addEventListener('DOMContentLoaded', initKeyStorage);

// שאר הפונקציות (callClaude, generateCandles וכו') נשארות זהות...
async function callClaude(prompt) {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "x-api-key": getAnthropicKey(),
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
            model: "claude-3-5-sonnet-20240620",
            max_tokens: 800,
            messages: [{ role: "user", content: prompt }],
        }),
    });
    const d = await r.json();
    return d.content?.[0]?.text || "";
}

function useTypewriter() {
    const [text, setText] = useState("");
    const [going, setGoing] = useState(false);
    const iv = useRef(null);
    const play = useCallback((full) => {
        clearInterval(iv.current);
        setText(""); setGoing(true);
        let i = 0;
        iv.current = setInterval(() => {
            i += 3;
            if (i >= full.length) { setText(full); setGoing(false); clearInterval(iv.current); }
            else setText(full.slice(0, i));
        }, 18);
    }, []);
    useEffect(() => () => clearInterval(iv.current), []);
    return { text, going, play };
}

function App() {
    const [search, setSearch] = useState("");
    const { text: aiText } = useTypewriter();

    return (
        <div dir="rtl" style={{padding: "0 20px"}}>
             <h1 style={{textAlign:"center", color:"#63b3ed", fontFamily:"monospace", fontWeight:"700", fontSize:"2.2rem", marginBottom: "5px"}}>
                DANI’S <span style={{color:"#f7fafc"}}>MONEY</span>
             </h1>
             <p style={{textAlign:"center", fontSize:"0.85rem", color: "#a0aec0", marginBottom: "20px"}}>{aiText || "מערכת ניתוח מניות אישית"}</p>
             
             <div style={{display:"flex", justifyContent:"center", marginBottom:"25px"}}>
                 <input 
                    placeholder="חיפוש מניה (למשל AAPL)..." 
                    onChange={e => setSearch(e.target.value)}
                    style={{padding:"12px 16px", borderRadius:"12px", border:"1px solid #333", background:"#1a1a1a", color:"white", width:"100%", maxWidth:"400px", fontSize: "16px"}}
                 />
             </div>
             
             <div style={{textAlign:"center", color:"#718096", fontSize: "0.9rem", padding: "40px 20px", border: "1px dashed #2d3748", borderRadius: "16px"}}>
                הזן מפתחות למעלה כדי להתחיל בניתוח מניות בזמן אמת.
             </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
