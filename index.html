<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Dani’s Money"/>
  <meta name="theme-color" content="#060b14"/>
  <title>Dani’s Money</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overscroll-behavior:none}
    body{background:#060b14;font-family:Heebo,system-ui,sans-serif;color:#f7fafc}
    :root{ --sat: env(safe-area-inset-top, 0px); }
    
    /* מוריד את התוכן למטה כדי שלא ייבלע במצלמה */
    #root{ padding-top: 80px; }
    
    input:focus{outline:none; border-color: #63b3ed !important;}
    button:active{transform: scale(0.96); opacity: 0.9;}
    .card { background: #1a1a1a; border-radius: 16px; padding: 20px; border: 1px solid #333; margin-top: 20px; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div style="padding: calc(var(--sat) + 12px) 10px 12px; background: #1a1a1a; color: white; border-bottom: 1px solid #333; text-align: center; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; position: fixed; top: 0; width: 100%; z-index: 100;">
    <div style="display: flex; align-items: center; gap: 6px;">
        <label style="font-size: 11px; opacity: 0.7;">Anthropic:</label>
        <input type="password" id="apiKeyInput" placeholder="sk-ant-..." style="background: #333; color: white; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; width: 110px; font-size: 11px;">
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
        <label style="font-size: 11px; opacity: 0.7;">Finnhub:</label>
        <input type="password" id="finnhubKeyInput" placeholder="Key" style="background: #333; color: white; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; width: 100px; font-size: 11px;">
    </div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// פונקציות לשליפת המפתחות מהתיבות למעלה
const getAnthropicKey = () => document.getElementById('apiKeyInput').value;
const getFinnhubKey = () => document.getElementById('finnhubKeyInput').value;

// פונקציה לביצוע הניתוח בזמן אמת
async function callAnalysis(ticker) {
    const aKey = getAnthropicKey();
    const fKey = getFinnhubKey();
    
    if (!aKey || !fKey) throw new Error("חובה להזין את שני המפתחות למעלה");
    
    // כאן תבוא הקריאה ל-Finnhub לקבלת מחיר ול-Claude לניתוח
    const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${fKey}`);
    const data = await response.json();
    return data;
}

// טעינת המפתחות מהזיכרון המקומי
const initKeyStorage = () => {
    const fields = [
        { id: 'apiKeyInput', storageKey: 'saved_anthropic' },
        { id: 'finnhubKeyInput', storageKey: 'saved_finnhub' }
    ];
    fields.forEach(field => {
        const input = document.getElementById(field.id);
        if (!input) return;
        const savedValue = localStorage.getItem(field.storageKey);
        if (savedValue) input.value = savedValue;
        input.addEventListener('input', (e) => localStorage.setItem(field.storageKey, e.target.value));
    });
};
window.addEventListener('DOMContentLoaded', initKeyStorage);

function App() {
    const [search, setSearch] = useState("");
    const [loading, setLoading] = useState(false);
    const [data, setData] = useState(null);
    const [error, setError] = useState(null);

    const handleStart = async () => {
        if (!search) return;
        setLoading(true);
        setError(null);
        try {
            const result = await callAnalysis(search);
            setData(result);
        } catch (err) {
            setError(err.message);
        } finally {
            setLoading(false);
        }
    };

    return (
        <div dir="rtl" style={{padding: "0 25px"}}>
             <h1 style={{textAlign:"center", color:"#63b3ed", fontFamily:"monospace", fontWeight:"700", fontSize:"2.4rem", marginBottom: "8px"}}>
                DANI’S <span style={{color:"#f7fafc"}}>MONEY</span>
             </h1>
             <p style={{textAlign:"center", fontSize:"0.9rem", color: "#a0aec0", marginBottom: "35px"}}>מערכת ניתוח מניות אישית</p>
             
             <div style={{display:"flex", flexDirection: "column", gap: "15px", alignItems: "center", marginBottom:"25px"}}>
                 <input 
                    placeholder="הזן טיקר (למשל AAPL)..." 
                    value={search}
                    onChange={e => setSearch(e.target.value.toUpperCase())}
                    style={{padding:"16px", borderRadius:"14px", border:"1px solid #333", background:"#1a1a1a", color:"white", width:"100%", maxWidth:"400px", fontSize:"18px", textAlign:"center"}}
                 />
                 
                 {/* כפתור האישור החדש שחיפשת */}
                 <button 
                    onClick={handleStart}
                    disabled={!search || loading}
                    style={{
                        width: "100%", maxWidth: "400px", padding: "16px", borderRadius: "14px", border: "none", 
                        background: search ? "#63b3ed" : "#2d3748", color: "#060b14", fontWeight: "700", fontSize: "16px",
                        cursor: (search && !loading) ? "pointer" : "not-allowed", transition: "0.2s"
                    }}>
                    {loading ? "מתחבר לנתונים..." : "התחלת ניתוח בזמן אמת"}
                 </button>
             </div>

             {error && <div style={{color: "#fc8181", textAlign: "center", marginTop: "10px"}}>{error}</div>}
             
             {data && (
                 <div className="card">
                    <h3 style={{color: "#63b3ed"}}>נתוני {search}:</h3>
                    <p>מחיר נוכחי: ${data.c}</p>
                    <p>שינוי יומי: {data.dp}%</p>
                 </div>
             )}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
